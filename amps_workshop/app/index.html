      "- Content Filtering Principles",

    "slideNumber": 2,
    "title": "Ad Hoc Topics: Zero Configuration \u26a1",
    "type": "concept",
    "content": [
      "AMPS does not require pre-declaring topics for basic Pub/Sub.",
      "**Ad Hoc Topics:** Topics created 'on the fly' when a publisher sends data.",
      "Publishers and subscribers are completely decoupled.",
      "A topic name determines the message stream."
    ],
    "speakerNotes": "One of AMPS' strengths is that you don't need to configure topics in advance for simple messaging. This is what we call 'Ad Hoc Topics'.",
    "module": 1
  },
  {
    "moduleId": "module-002",
    "slideNumber": 3,
    "title": "Topic Identifiers \ud83c\udff7\ufe0f",
    "type": "specification",
    "content": [
      "Topics are the primary way to categorize message streams.",
      "Topics are message-type specific (JSON 'quotes' != XML 'quotes').",
      "**Regex Subscriptions:** Subscribers can use regular expressions to match multiple topics.",
      "Example: `^ORDERS_.*` matches `ORDERS_US`, `ORDERS_EU`, etc."
    ],
    "speakerNotes": "Subscribers can use regular expressions to listen to multiple topics at once, further decoupling them from the publisher's specific topic choices.",
    "module": 1
  },
  {
    "moduleId": "module-002",
    "slideNumber": 4,
    "title": "Content Filtering: The 'WHERE' Clause \ud83d\udd0d",
    "type": "concept",
    "content": [
      "Content Filtering allows subscribers to receive only the data they need.",
      "**Benefits:**",
      "- **Bandwidth Efficiency:** Less data sent over the wire.",
      "- **Decoupling:** Publishers don't need to know subscriber needs.",
      "- **Simpler Clients:** Code only processes relevant messages."
    ],
    "speakerNotes": "Think of content filtering as a SQL WHERE clause for your message stream. It moves the selection logic from the client to the server.",
    "module": 1
  },
  {

    "slideNumber": 5,

    "title": "AMPS Filter Grammar \ud83c\udfd7\ufe0f",
    "type": "specification",
    "content": [
      "AMPS uses a combination of two standards:",
      "1. **XPath Identifiers:** To locate fields within the message.",
      "2. **SQL-92 Operators:** To form the comparison predicate.",
      "**Example:** `/Order/Symbol = 'MSFT' AND /Order/Qty > 100`"
    ],
    "speakerNotes": "If you know XPath and SQL, you already know 90% of AMPS filtering. We use XPath for paths and SQL for the logic.",
    "module": 1
  },

    "slideNumber": 7,
    "title": "XPath Identifiers in AMPS \ud83d\udccd",
    "type": "specification",
    "content": [
      "Identifiers specify the value of an attribute or element.",
      "- **JSON/XML:** `/Order/Symbol`",
      "- **FIX:** `/55` (using tag numbers)",
      "- **Special Names:** `[/Field With Spaces]` (use brackets for non-standard names)."

    "speakerNotes": "AMPS uses a subset of XPath. For FIX, we use the tag number as the field name. Brackets allow for field names that don't fit standard XPath naming rules.",

      "- **Integer:** 64-bit signed/unsigned.",

      "- **Boolean:** `true` or `false`.",
      "- **NULL:** Missing or empty fields."

      "**Arithmetic:** `+`, `-`, `*`, `/`, `%`, `MOD`.",

      "**Range:** `<`, `<=`, `>`, `>=`",

      "**Examples:**",
      "- `/qty BETWEEN 1 AND 10`",

    "speakerNotes": "IN is highly optimized in AMPS. It's generally faster than using multiple OR statements for the same field.",

    "title": "String Operators: LIKE, BEGINS WITH \ud83e\uddf5",

    "content": [
      "- **BEGINS WITH**: Optimized prefix matching (case-sensitive).",
      "- **ENDS WITH**: Optimized suffix matching.",
      "- **LIKE**: Full PCRE (Perl Compatible Regular Expression) matching.",
      "**Example:** `/name LIKE '(?i)gyro'` (case-insensitive match)."

    "title": "Handling NULL & NaN \ud83e\udde9",
    "type": "concept",
    "content": [

    "type": "bullets",
    "content": [
      "SOW = State of the World.",
      "A high-performance database within AMPS.",
      "Stores the 'last value' for every unique message.",
      "Enables applications to query current state immediately."
    ],
    "speakerNotes": "Think of the SOW as a real-time database. While pub/sub handles the stream, the SOW handles the state.",
    "module": 2
  },

    "moduleId": "module-003",
    "slideNumber": 3,
    "title": "SOW vs. Pub/Sub \ud83d\udd04",
    "type": "bullets",
    "content": [
      "**Pub/Sub**: Ephemeral. You get messages only while you are connected.",
      "**SOW**: Persistent. You can ask 'What is the current price of IBM?' at any time.",
      "Use Pub/Sub for notifications; use SOW for state management."
    ],
    "speakerNotes": "Pub/sub is like a radio broadcast. SOW is like a library where you can look up the latest edition of a book.",

      "Ideal for view servers and real-time dashboards."

      "**The Goal**: Distribute work across multiple workers without duplication.",

      "AMPS acts as the 'Load Balancer'.",
      "Messages are distributed based on consumer capacity and availability.",

  {
    "moduleId": "module-007",
    "slideNumber": 2,
    "title": "Why High Availability?",
    "type": "bullets",
    "content": [
      "Hardware fails, networks glitch, and sites go dark. \ud83d\udca5",
      "Business-critical data needs to be available regardless.",
      "AMPS provides 'Always On' capabilities through:",
      "  - Persistent Transaction Logging \ud83d\udcdc",
      "  - Real-time Integrated Replication \ud83d\udd04",
      "  - Automatic Client Failover \u26a1"
    ],
    "speakerNotes": "High availability isn't just about the server; it's about the entire ecosystem working together to mask failures from the end-user.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 3,
    "title": "The Core Architecture: Peer-to-Peer",
    "type": "bullets",
    "content": [
      "No single point of failure (No controller/quorum nodes).",
      "Leaderless: Every node is 'hot' and processes independently. \ud83d\udd25",
      "Replication is point-to-point and unidirectional by default.",
      "Bidirectional replication creates a Hot-Hot pair."
    ],
    "speakerNotes": "Unlike some systems that rely on a central 'zoo-keeper' or 'orchestrator', AMPS nodes are independent peers. This simplifies deployment and increases resilience.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 4,
    "title": "Replication Topologies: Pair (Hot-Hot)",
    "type": "diagram",
    "content": [
      "Standard failover configuration.",
      "Two instances (Group A) replicating to each other.",
      "Clients can connect to either instance."
    ],
    "mermaid": "graph LR\n  A[Instance 1] <-->|Sync Replication| B[Instance 2]\n  C[Client] --> A\n  C -.->|Failover| B",
    "speakerNotes": "The Pair topology is the bread and butter of AMPS HA. Usually configured with Synchronous replication.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 5,
    "title": "Replication Topologies: Hub and Spoke (Star)",
    "type": "diagram",
    "content": [
      "Scaling out to hundreds of downstream consumers.",
      "Ingestion Tier -> Hub Tier -> Application Tier.",
      "Hubs act as pure distributors (no SOW, usually)."
    ],
    "mermaid": "graph LR\n  I[Ingestion] --> H[Hub]\n  H --> S1[Spoke 1]\n  H --> S2[Spoke 2]\n  H --> S3[Spoke 3]",
    "speakerNotes": "Hub and Spoke is ideal for distributing data to different regions or departments without putting load on the ingestion servers.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 6,
    "title": "Replication Topologies: Mesh",
    "type": "diagram",
    "content": [
      "Highly interconnected network.",
      "Uses PassThrough replication to forward data.",
      "Multiple paths for redundancy. \ud83d\udd78\ufe0f"
    ],
    "mermaid": "graph TD\n  A <--> B\n  B <--> C\n  C <--> A\n  A <--> D\n  D <--> B",
    "speakerNotes": "Mesh topologies provide maximum redundancy but require careful configuration of PassThrough rules to avoid infinite loops.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 7,
    "title": "Sync vs. Async Replication",
    "type": "bullets",
    "content": [
      "**Sync (Synchronous):** \ud83e\udd1d",
      "  - Publisher waits for ACK from ALL sync destinations.",
      "  - Zero data loss guarantee during failover.",
      "**Async (Asynchronous):** \ud83d\ude80",
      "  - Publisher gets ACK as soon as the message is local.",
      "  - High performance, suitable for DR sites."
    ],
    "speakerNotes": "Choose Sync for local HA pairs and Async for remote Disaster Recovery sites where latency might be high.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 8,
    "title": "Failover: The 'Self-Healing' Instance",
    "type": "bullets",
    "content": [
      "AMPS instances are aware of what they've missed.",
      "**Resynchronization (Resync):** On reconnect, the source replays missed journals.",
      "Uses `/AMPS/Tx/Checkpoint` to find the exact restart point.",
      "Ensures the transaction log is eventually consistent. \ud83e\ude79"
    ],
    "speakerNotes": "Resync happens automatically. You don't need to manually restore backups or 'sync' files.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 9,
    "title": "Client Failover: HAClient",
    "type": "bullets",
    "content": [
      "The AMPS Client Libraries (Java, C++, Python, etc.) handle the heavy lifting.",
      "**HAClient Features:**",
      "  - Automatic Reconnection.",
      "  - Subscription Recovery.",
      "  - Duplicate Suppression using Sequence Numbers."
    ],
    "speakerNotes": "By using the HAClient class, your application code stays simple while AMPS manages the network complexity.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 10,
    "title": "Bookmark Subscriptions: Resume Anywhere",
    "type": "bullets",
    "content": [
      "Subscriptions can survive both client and server restarts.",
      "Client stores the last seen 'Bookmark'.",
      "On reconnect, client says: 'Start from Bookmark X'.",
      "AMPS replays exactly what was missed. \ud83d\udcd1"
    ],
    "speakerNotes": "Bookmarks are the key to durable subscriptions. They work across any instance in the replication group.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 11,
    "title": "Transactional Integrity: Sequence Numbers",
    "type": "bullets",
    "content": [
      "Every message has a **Client Name** + **Sequence Number**.",
      "Prevents duplicates if a publisher resends during failover.",
      "AMPS 'Duplicate Detection' ensures one record in the SOW. \u2705"
    ],
    "speakerNotes": "Sequence numbers ensure that even if a publisher 'blindly' resends, the system stays consistent.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 12,
    "title": "Replicating the SOW",
    "type": "bullets",
    "content": [
      "SOW caches are replicated command-by-command.",
      "Replicates `publish`, `delta_publish`, and `sow_delete`.",
      "Ensures real-time query results are identical on all nodes. \ud83d\udcc2"
    ],
    "speakerNotes": "When you update a SOW record, the 'delta' or 'publish' is sent across the wire, updating all mirrored SOW files.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 13,
    "title": "Replicating Queues: Ownership",
    "type": "bullets",
    "content": [
      "Queues are tricky: Only one person can process a message! \u261d\ufe0f",
      "**Message Ownership:** The instance that received the publish 'owns' the message.",
      "Only the owner delivers to its local subscribers.",
      "Other nodes can 'request' ownership if they have idle workers."
    ],
    "speakerNotes": "Queue replication ensures that delivery guarantees are maintained even in a distributed cluster.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 14,
    "title": "Disaster Recovery: Proxied Transfer",
    "type": "bullets",
    "content": [
      "What if the owner of a queue message goes offline? \ud83d\ude31",
      "**Proxied Transfer:** Allows another instance to 'proxy' the ownership.",
      "Ensures queue messages don't get 'stuck' on a dead server.",
      "Used for temporary recovery during site failures."
    ],
    "speakerNotes": "Proxied transfer is a powerful DR tool for queues, allowing work to continue even if the original ingestion site is gone.",
    "module": 6
  },
  {
    "moduleId": "module-007",
    "slideNumber": 15,
    "title": "Best Practices for HA",
    "type": "bullets",
    "content": [
      "1. Always use unique **Client Names**. \ud83c\udd94",
      "2. Use **Sync** replication for failover partners.",
      "3. Enable **PassThrough** for cluster-wide visibility.",
      "4. Monitor your replication latency using the Admin console. \ud83d\udcca"
    ],
    "speakerNotes": "Following these rules will save you from common headaches like message loss or split-brain scenarios.",

    "type": "title",
    "content": [
      "Welcome to Module 9!",
      "In this session, we will explore how AMPS keeps your data safe and ensures that only the right people have access to the right resources.",
      "Topic coverage:",
      "\u2022 Authentication & Logon",
      "\u2022 Resource Entitlements",
      "\u2022 Content-Based Security",
      "\u2022 Field-Level Security",
      "\u2022 Enterprise Integration Modules"
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 2,
    "title": "The Security Trinity \ud83d\udd12",
    "type": "content",
    "content": [
      "AMPS security is built on three pillars:",
      "1. **Authentication**: Who are you? (Identity Verification)",
      "2. **Entitlement**: What are you allowed to do? (Access Control)",
      "3. **Encryption**: Keeping data private in transit (TLS/SSL)",
      "Built with a plugin-based architecture for maximum flexibility! \ud83d\udd0c"
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 3,
    "title": "Authentication Flow \ud83d\udd11",
    "type": "diagram",
    "content": [
      "How AMPS verifies your identity when you connect."
    ],
    "mermaid": "sequenceDiagram\n    participant Client\n    participant AMPS\n    participant AuthModule\n    participant IDP as Identity Provider\n\n    Client->>AMPS: Connect & Logon(user, pass)\n    AMPS->>AuthModule: authenticate(user, pass)\n    AuthModule->>IDP: Validate Credentials\n    IDP-->>AuthModule: Success/Fail\n    AuthModule-->>AMPS: Authenticated User Context\n    AMPS-->>Client: Logon Acknowledged",
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 4,
    "title": "Logon Methods: Explicit vs. Implicit \ud83d\udccb",
    "type": "content",
    "content": [
      "**Explicit Logon**: The client sends a `logon` command with credentials immediately after connecting. (Recommended! \u2705)",
      "**Implicit Logon**: The client sends a command (like `subscribe`) without logging in first. AMPS tries to authenticate with an empty username/password.",
      "\u26a0\ufe0f Implicit logon is **disabled by default** in modern AMPS for better security."
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 5,
    "title": "Entitlements Overview \ud83d\udea6",
    "type": "content",
    "content": [
      "Entitlements are the 'Gatekeepers' of AMPS.",
      "They control access to every operation:",
      "\u2022 Can this user subscribe to this topic?",
      "\u2022 Can they publish to that queue?",
      "\u2022 Are they allowed to see the admin console?",
      "Checked at the start of a command and cached for performance! \u26a1"
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 6,
    "title": "Resource Types & Permissions \ud83c\udfab",
    "type": "content",
    "content": [
      "AMPS categorizes resources into four main types:",
      "\u2022 **logon**: Permission to enter the system.",
      "\u2022 **topic**: Access to message data (read/write).",
      "\u2022 **admin**: Access to statistics and management commands.",
      "\u2022 **replication_logon**: Permission for other AMPS instances to connect.",
      "Permissions can be `read`, `write`, or `none`."
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 7,
    "title": "Entitlement Check Flow \ud83d\udd04",
    "type": "diagram",
    "content": [
      "AMPS checks permissions for every resource access."
    ],
    "mermaid": "graph TD\n    A[Client Request] --> B{In Cache?}\n    B -- Yes --> C[Apply Cached Result]\n    B -- No --> D[Call Entitlement Module]\n    D --> E{Allowed?}\n    E -- Yes --> F[Cache & Execute]\n    E -- No --> G[Reject Request]\n    F --> H[Apply Content Filters/Select Lists]",
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 8,
    "title": "Content-Based Security \ud83d\udd0d",
    "type": "content",
    "content": [
      "Restrict visibility at the **record level** using filter predicates.",
      "Example: A user can only see orders where `/Region == 'EMEA'`.",
      "\u2022 Enforced by the server on every message.",
      "\u2022 Completely transparent to the application.",
      "\u2022 Allows multi-tenant topics where users only see 'their' data. \ud83c\udfd8\ufe0f"
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 9,
    "title": "Field-Level Security \ud83d\ude48",
    "type": "content",
    "content": [
      "Hide sensitive data using **Select Lists**.",
      "Example: Strip the `/CreditCardNumber` field from messages for regular users, but keep it for the Billing service.",
      "\u2022 `-/CC_Number` -> Removes the field.",
      "\u2022 `+/ID, +/Price` -> Only includes specified fields.",
      "Privacy by design! \ud83d\udd75\ufe0f"
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 10,
    "title": "Enterprise Integration Modules \ud83c\udfe2",
    "type": "content",
    "content": [
      "AMPS doesn't just do 'simple' auth; it scales to the enterprise:",
      "\u2022 **Multimethod**: Integrates with LDAP and Kerberos. \ud83d\udee1\ufe0f",
      "\u2022 **OAuth**: Modern web-scale authentication. \ud83c\udf10",
      "\u2022 **RESTful (HTTP)**: Ask an external web service for permissions. \ud83c\udf0d",
      "\u2022 **Simple Access**: Regex-based allow/deny lists for easy setup."
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 11,
    "title": "Protecting Data in Transit: TLS/SSL \ud83d\ude84",
    "type": "content",
    "content": [
      "Encryption is vital for security over untrusted networks.",
      "\u2022 Standard TLS/SSL for client-server links.",
      "\u2022 **Mutual TLS (mTLS)**: Server verifies the client's certificate too! \ud83e\udd1d",
      "\u2022 Independent of the Auth/Entitlement system \u2013 defense in depth."
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 12,
    "title": "Outbound Security & Authenticators \ud83d\udce4",
    "type": "content",
    "content": [
      "AMPS itself needs to 'log on' to other systems (like for replication).",
      "**Authenticators** handle this:",
      "\u2022 Provide credentials to downstream instances.",
      "\u2022 Can run external commands to fetch tokens.",
      "\u2022 Supports Kerberos and LDAP for outbound links."
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 13,
    "title": "Best Practices for AMPS Security \ud83c\udfc6",
    "type": "content",
    "content": [
      "\u2022 **Use Explicit Logon**: Always know who is connecting.",
      "\u2022 **Enable TLS**: Never send sensitive data in the clear.",
      "\u2022 **Least Privilege**: Only grant the permissions needed for the job.",
      "\u2022 **Regularly Reset Caches**: Ensure permission changes take effect.",
      "\u2022 **Monitor Admin Access**: The admin console is powerful \u2013 protect it! \u26a1"
    ],
    "module": 8
  },
  {
    "moduleId": "module-009",
    "slideNumber": 14,
    "title": "Summary & Key Takeaways \ud83d\udcdd",
    "type": "content",
    "content": [
      "\u2022 Security is baked into the core of AMPS, not an afterthought.",
      "\u2022 Plugins allow integration with ANY enterprise system.",
      "\u2022 Content and Field-level security provide fine-grained control.",
      "\u2022 A secure AMPS instance is a happy (and compliant) instance! \ud83d\ude0a"
    ],
    "module": 8
  },

      "Don't block the main thread! \ud83d\uded1",
      "Message Handlers: Register a function/method to handle incoming data.",
      "Concurrency: AMPS clients often use background threads for network I/O.",
      "Thread Safety: Ensure your handler logic is thread-safe or hands off to a worker queue."

    function ensureProgress() {
      if (!progress.modules) progress.modules = {};
      if (!progress.answered) progress.answered = {};
      if (!progress.failed) progress.failed = [];
      if (!progress.recovered) progress.recovered = {};
      if (!progress.moduleScores) progress.moduleScores = {};
      if (!progress.slidesSeen) progress.slidesSeen = 0;
      if (!progress.streakDays) progress.streakDays = 0;
      if (!progress.lastStudyDate) progress.lastStudyDate = null;
      if (!progress.achievements) progress.achievements = [];
      return progress;
    }

    function updateStreak() {
      const today = new Date().toISOString().slice(0,10);
      if (progress.lastStudyDate === today) return;
      const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
      if (progress.lastStudyDate === yesterday) {
        progress.streakDays = (progress.streakDays||0) + 1;
      } else {
        progress.streakDays = 1;
      }
      progress.lastStudyDate = today;
    }

    function overallPercent() {
      let completed = 0, total = 0;
      for (let i=0;i<MODULE_NAMES.length;i++) {
        const modSlides = SLIDES.filter(s=>s.module===i);
        const seen = new Set();
        (progress.modules['mod-'+i]?.seenSlides||[]).forEach(s=>seen.add(s));
        completed += seen.size;
        total += modSlides.length;
      }
      return total ? Math.round((completed/total)*100) : 0;
    }

    function getAchievements() {
      ensureProgress();
      return ACHIEVEMENTS.map(a => ({...a, unlocked: a.check(progress)}));
    }

      '\\rightarrow':'→', '\\leftarrow':'←', '\\Rightarrow':'⇒', '\\Leftarrow':'⇐'
    };
    function replaceCommands(str) {
      let s = str;
      for (const [k,v] of Object.entries(OPS)) s = s.split(k).join(v);
      for (const [k,v] of Object.entries(GREEK)) s = s.split('\\'+k).join(v);
      return s;
    }
    function tokenizeMath(latex) {
      const tokens = []; let i = 0; const s = replaceCommands(latex);
      function readGroup() { let d=0,j=i; if (s[j]!=='{') return null; j++; while (j<s.length) { if (s[j]==='\\') { j+=2; continue; } if (s[j]==='{') d++; if (s[j]==='}') { if (d===0) { const g=s.slice(i+1,j); i=j+1; return g; } d--; } j++; } return null; }
      while (i<s.length) { if (s[i]===' ') { i++; continue; } if (s[i]==='\\') { const m=s.slice(i).match(/^\\(frac|sqrt)(?![a-zA-Z])/); if (m) { i+=m[0].length; if (m[1]==='frac') { const num=readGroup(), den=readGroup(); tokens.push({type:'frac',num,den}); } else if (m[1]==='sqrt') { let index=null; if (s[i]==='[') { const close=s.indexOf(']',i); index=s.slice(i+1,close); i=close+1; } const arg=readGroup(); tokens.push({type:'sqrt',index,arg}); } continue; } } if (s[i]==='^') { i++; const sup=readGroup()||s[i++]||''; tokens.push({type:'sup',sup}); continue; } if (s[i]==='_') { i++; const sub=readGroup()||s[i++]||''; tokens.push({type:'sub',sub}); continue; } let j=i; while (j<s.length && !'^{}_\\ '.includes(s[j])) j++; tokens.push({type:'text',text:s.slice(i,j)}); i=j; }
      return tokens;
    }
    class CanvasMathPainter {
      constructor(ctx) { this.ctx=ctx; this.fontSize=22; this.small=14; this.tiny=11; this.lineWidth=1.5; }
      setFont(size) { this.ctx.font=`${size}px system-ui,-apple-system,Segoe UI,Roboto,sans-serif`; }
      measureText(text,size) { this.setFont(size||this.fontSize); return this.ctx.measureText(text).width; }
      drawText(text,x,y,size,baseline) { this.setFont(size||this.fontSize); this.ctx.textBaseline=baseline||'alphabetic'; this.ctx.fillText(text,x,y); return this.measureText(text,size); }
      paint(tokens,x,y) { let cx=x; for (const tok of tokens) { if (tok.type==='text') { cx+=this.drawText(tok.text,cx,y,this.fontSize); } else if (tok.type==='frac') { const numTokens=tokenizeMath(tok.num), denTokens=tokenizeMath(tok.den); const nw=this.widthOf(numTokens), dw=this.widthOf(denTokens); const w=Math.max(nw,dw)+10; const mid=y-this.fontSize*0.35; this.paint(numTokens,cx+w/2-nw/2,mid-4); this.ctx.beginPath(); this.ctx.lineWidth=this.lineWidth; this.ctx.moveTo(cx,mid); this.ctx.lineTo(cx+w,mid); this.ctx.stroke(); this.paint(denTokens,cx+w/2-dw/2,mid+this.fontSize+2); cx+=w+4; } else if (tok.type==='sup') { const supTokens=tokenizeMath(tok.sup); const sw=this.widthOf(supTokens,this.small); this.paint(supTokens,cx,y-this.fontSize*0.5,this.small); cx+=sw+2; } else if (tok.type==='sub') { const subTokens=tokenizeMath(tok.sub); const sw=this.widthOf(subTokens,this.small); this.paint(subTokens,cx,y+this.fontSize*0.35,this.small); cx+=sw+2; } else if (tok.type==='sqrt') { const argTokens=tokenizeMath(tok.arg); const aw=this.widthOf(argTokens); const pad=6; const w=aw+pad*2; const top=y-this.fontSize, bottom=y+4; this.ctx.beginPath(); this.ctx.lineWidth=this.lineWidth; this.ctx.moveTo(cx+4,bottom-6); this.ctx.lineTo(cx+10,bottom); this.ctx.lineTo(cx+14,top); this.ctx.lineTo(cx+w,top); this.ctx.stroke(); if (tok.index) this.drawText(tok.index,cx,top+4,this.tiny); this.paint(argTokens,cx+16,y); cx+=w+14; } } return cx; }
      widthOf(tokens,size) { const old=this.fontSize; if (size) this.fontSize=size; let w=0; for (const tok of tokens) { if (tok.type==='text') w+=this.measureText(tok.text); else if (tok.type==='frac') { const nw=this.widthOf(tokenizeMath(tok.num)); const dw=this.widthOf(tokenizeMath(tok.den)); w+=Math.max(nw,dw)+14; } else if (tok.type==='sup') w+=this.widthOf(tokenizeMath(tok.sup),this.small)+2; else if (tok.type==='sub') w+=this.widthOf(tokenizeMath(tok.sub),this.small)+2; else if (tok.type==='sqrt') w+=this.widthOf(tokenizeMath(tok.arg))+26; } this.fontSize=old; return w; }
    }
    function renderMathWithCanvas(latex, container) {
      const canvas=document.createElement('canvas'); canvas.className='formula-canvas'; const ctx=canvas.getContext('2d'); const painter=new CanvasMathPainter(ctx); const tokens=tokenizeMath(latex); const width=Math.max(100,painter.widthOf(tokens)+40); const height=80; const dpr=window.devicePixelRatio||1; canvas.width=width*dpr; canvas.height=height*dpr; canvas.style.width=width+'px'; canvas.style.height=height+'px'; ctx.scale(dpr,dpr); ctx.clearRect(0,0,width,height); ctx.fillStyle=getComputedStyle(document.body).color; painter.paint(tokens,20,height/2+8); container.appendChild(canvas);
    }
    function renderMath(formula, container) {
      container.innerHTML='';
      if (typeof katex!=='undefined') { try { const el=document.createElement('span'); katex.render(formula,el,{throwOnError:false,displayMode:true}); container.appendChild(el); return; } catch(e) { console.warn('KaTeX failed, falling back to canvas',e); } }
      renderMathWithCanvas(formula,container);
    }

    // ===== RENDER =====
    function render() {
      ensureProgress();
      updateStreak();
      inDashboard = false;
      const s = SLIDES[idx];
      elCounter.textContent = `${idx + 1} / ${SLIDES.length}`;
      elTopBar.style.width = `${((idx + 1) / SLIDES.length) * 100}%`;

      // Track seen slides
      const modKey = 'mod-' + s.module;
      if (!progress.modules[modKey]) progress.modules[modKey] = { seenSlides: [] };
      if (!progress.modules[modKey].seenSlides.includes(idx)) progress.modules[modKey].seenSlides.push(idx);
      progress.slidesSeen = Math.max(progress.slidesSeen||0, progress.modules[modKey].seenSlides.length);

      if (s.type === 'quiz') {
        renderQuiz(s);
      } else {
        elSlide.innerHTML = `
          <h2>${escapeHtml(s.title)}</h2>
          ${(s.content || []).map(c => `<p>${escapeHtml(c)}</p>`).join('')}
          ${s.visualAssets ? s.visualAssets.map(a => `<img src="${escapeHtml(a)}" alt="" />`).join('') : ''}
          ${s.formula ? `<div class="formula-block" data-formula="${escapeHtml(s.formula)}"></div>` : ''}
          ${s.table ? renderTable(s.table) : ''}
          ${s.speakerNotes ? `<details><summary>💡 Teacher Tip</summary><p>${escapeHtml(s.speakerNotes)}</p></details>` : ''}
        `;
        elSlide.querySelectorAll('.formula-block').forEach(block => renderMath(block.getAttribute('data-formula'), block));
      }
      updateTocActive();
      save();
    }

    function renderDashboard() {
      inDashboard = true;
      ensureProgress();
      updateStreak();
      const pct = overallPercent();
      const achievements = getAchievements();
      const unlocked = achievements.filter(a=>a.unlocked).length;
      elCounter.textContent = '🏠 Home';
      elTopBar.style.width = pct + '%';
      elSlide.innerHTML = `
        <div class="dashboard">
          <h2>📚 ${escapeHtml('AMPS 5.3.5 Complete Workshop')}</h2>
          <div class="streak-pill">🔥 ${progress.streakDays||0} day streak</div>
          <p style="color:#64748b;font-size:0.95rem">You're doing amazing! Keep it up!</p>
          <div class="big-progress"><div style="width:${pct}%"></div></div>
          <p style="font-weight:700;color:var(--violet)">${pct}% complete</p>
          <h3 style="margin-top:1.5rem;color:var(--coral)">🏅 Achievements (${unlocked}/${achievements.length})</h3>
          <div class="achievement-grid">
            ${achievements.map(a=>`<div class="achievement ${a.unlocked?'unlocked':''}"><span class="emoji">${a.emoji}</span>${a.title}</div>`).join('')}
          </div>
          <h3 style="margin-top:1.5rem;color:var(--emerald)">📖 Your Modules</h3>
          <div style="max-width:500px;margin:0 auto;text-align:left">
            ${MODULE_NAMES.map((name,i)=>{
              const modSlides = SLIDES.filter(s=>s.module===i);
              const seen = new Set(progress.modules['mod-'+i]?.seenSlides||[]);
              const modPct = modSlides.length ? Math.round((seen.size/modSlides.length)*100) : 0;
              return `<div style="margin:0.75rem 0;padding:0.75rem;background:#f8fafc;border-radius:0.75rem;border-left:4px solid var(--accent)">
                <div style="font-weight:700">${name}</div>
                <div style="font-size:0.85rem;color:#64748b">${seen.size} / ${modSlides.length} slides seen</div>
                <div class="big-progress" style="margin:0.5rem 0;height:10px"><div style="width:${modPct}%;background:linear-gradient(90deg,var(--accent),var(--emerald))"></div></div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `;
      updateTocActive();
      save();
    }

    function renderQuiz(s) {
      const q = s.questions[0];
      const mod = MODULE_NAMES[s.module] || `Module ${s.module + 1}`;
      const answered = progress.answered && progress.answered[q.id];
      const encourage = answered ? (answered.selected === q.correctAnswer ? pickRandom(ENCOURAGE_CORRECT) : pickRandom(ENCOURAGE_WRONG)) : '';
      elSlide.innerHTML = `
        <h2>📝 ${escapeHtml(s.title)} <span class="badge ${q.difficulty}">${q.difficulty}</span></h2>
        <p style="color:#64748b"><strong>${mod}</strong></p>
        <p style="font-size:1.1rem">${escapeHtml(q.question)}</p>
        <div id="quiz-options">
          ${q.options.map((opt) => `
            <button class="quiz-option ${answered ? (opt === q.correctAnswer ? 'correct' : (answered.selected === opt ? 'wrong' : '')) : ''}"
              ${answered ? 'disabled' : ''}
              data-opt="${escapeHtml(opt)}">${escapeHtml(opt)}</button>
          `).join('')}
        </div>
        <div id="quiz-feedback" class="${answered ? '' : 'hidden'}">
          ${answered ? `<div class="encourage-box ${answered.selected === q.correctAnswer ? 'pass' : 'fail'}">${encourage}<br><span style="font-weight:400;font-size:0.95rem">${escapeHtml(q.explanation)}</span></div>` : ''}
        </div>
      `;
      if (!answered) {
        elSlide.querySelectorAll('.quiz-option').forEach(btn => {
          btn.addEventListener('click', () => {
            const selected = btn.getAttribute('data-opt');
            progress.answered[q.id] = { selected };
            if (selected !== q.correctAnswer) {
              if (!progress.failed.includes(q.id)) progress.failed.push(q.id);
            } else {
              progress.recovered[q.id] = true;
              // module score tracking
              const modKey = 'mod-' + s.module;
              if (!progress.moduleScores) progress.moduleScores = {};
              const modQs = SLIDES.filter(sl=>sl.module===s.module && sl.type==='quiz').flatMap(sl=>sl.questions);
              const correct = modQs.filter(mq=>(progress.answered[mq.id]?.selected)===mq.correctAnswer).length;
              progress.moduleScores[modKey] = modQs.length ? Math.round((correct/modQs.length)*100) : 0;
            }
            // Check for celebration
            const modKey = 'mod-' + s.module;
            const modSlides = SLIDES.filter(sl=>sl.module===s.module);
            const seen = new Set(progress.modules[modKey]?.seenSlides||[]);
            if (seen.size >= modSlides.length && !progress.celebratedModules) progress.celebratedModules = [];
            if (seen.size >= modSlides.length && progress.celebratedModules && !progress.celebratedModules.includes(modKey)) {
              progress.celebratedModules.push(modKey);
              celebrate();
            }
            render();
          });
        });
      }
    }

    function renderTable(table) {
      const head = table.columns.map(c => `<th>${escapeHtml(c)}</th>`).join('');
      const body = table.rows.map(r => `<tr>${r.map(c => `<td>${escapeHtml(c)}</td>`).join('')}</tr>`).join('');
      return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
    }

    function updateTocActive() {
      elTocList.querySelectorAll('li').forEach((li, i) => li.classList.toggle('active', i === idx && !inDashboard));
    }

    function buildToc() {
      elTocList.innerHTML = `<li data-dash="1" style="font-weight:700;background:var(--amber-light);color:#92400e">🏠 Dashboard</li>` +
        SLIDES.map((s, i) => `<li data-i="${i}">${i + 1}. ${escapeHtml(s.title)}</li>`).join('');
      elTocList.querySelectorAll('li').forEach(li => {
        if (li.getAttribute('data-dash')) li.addEventListener('click', () => { renderDashboard(); elToc.classList.remove('open'); });
        else li.addEventListener('click', () => { idx = +li.getAttribute('data-i'); render(); elToc.classList.remove('open'); });
      });
    }

    // ===== NAVIGATION =====
    function go(n) { if (inDashboard) { idx = Math.max(0, Math.min(SLIDES.length - 1, n)); render(); } else { idx = Math.max(0, Math.min(SLIDES.length - 1, n)); render(); } }
    document.getElementById('btn-prev').addEventListener('click', () => go(idx - 1));
    document.getElementById('btn-next').addEventListener('click', () => go(idx + 1));
    document.getElementById('btn-toc').addEventListener('click', () => elToc.classList.toggle('open'));
    document.getElementById('btn-dash').addEventListener('click', () => renderDashboard());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') go(idx + 1);
      if (e.key === 'ArrowLeft') go(idx - 1);
      if (e.key === 'Home') go(0);
      if (e.key === 'End') go(SLIDES.length - 1);
      if (e.key === 't') elToc.classList.toggle('open');
    });

    // ===== CLIENT-SIDE STORAGE (localStorage + cookie fallback) =====
    function storageSet(key, value) {
      const json = JSON.stringify(value);
      try {
        localStorage.setItem(key, json);
      } catch {
        // localStorage blocked (private mode, storage full) — fall back to cookie
        const expires = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toUTCString();
        document.cookie = key + '=' + encodeURIComponent(json) + '; expires=' + expires + '; path=/; SameSite=Strict';
      }
    }
    function storageGet(key) {
      try {
        const v = localStorage.getItem(key);
        if (v) return JSON.parse(v);
      } catch {}
      // Fallback to cookie
      const match = document.cookie.match(new RegExp('(?:^|;\\s*)' + key + '=([^;]*)'));
      if (match) {
        try { return JSON.parse(decodeURIComponent(match[1])); } catch {}
      }
      return null;
    }
    function loadProgress() {
      return storageGet(STORE_KEY) || {};
    }
    function save() {
      progress.lastSlide = idx;
      storageSet(STORE_KEY, progress);
    }

    // ===== UTILS =====
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }
    function pickRandom(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

    // ===== INIT =====
    buildToc();
    if (progress.lastSlide != null) { idx = progress.lastSlide; render(); }
    else renderDashboard();
  </script>
</body>
</html>
