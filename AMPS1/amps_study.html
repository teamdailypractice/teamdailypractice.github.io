    `<pre><code>$ ./bin/amps config/amps-config.xml &amp;</code></pre>`,
    `<p>Stop AMPS gracefully by sending a <strong>SIGINT</strong> or <strong>SIGTERM</strong> signal:</p>`,
    `<pre><code>$ kill -SIGTERM &lt;amps_pid&gt;</code></pre>`,
    `<div class="callout"><div class="callout-title">⚠️ Important</div>Always use graceful shutdown. Forced termination can corrupt the SOW or transaction log.</div>`
  ]},
  { moduleId: 'M1', type: 'concept', title: 'Command Line Options', content: [
    `<p>Common command-line options for the AMPS server:</p>`,
    `<table>`,
    `<tr><th>Option</th><th>Description</th></tr>`,
    `<tr><td><code>--version</code></td><td>Display version information</td></tr>`,
    `<tr><td><code>--help</code></td><td>Show help message</td></tr>`,
    `<tr><td><code>-config &lt;file&gt;</code></td><td>Specify configuration file path</td></tr>`,
    `<tr><td><code>-log &lt;file&gt;</code></td><td>Specify log file location</td></tr>`,
    `<tr><td><code>-minidump</code></td><td>Enable minidump generation on crash</td></tr>`,
    `</table>`,
    `<p>The configuration file is the primary way to control AMPS behavior.</p>`
  ]},
  { moduleId: 'M1', type: 'concept', title: 'JSON Messages Quick Primer', content: [
    `<p>AMPS supports multiple message formats. <strong>JSON</strong> is the most commonly used:</p>`,
    `<pre><code>{\n  "Ticker": "IBM",\n  "Price": 125.50,\n  "Quantity": 1000,\n  "Side": "BUY"\n}</code></pre>`,
    `<p>Key rules for AMPS JSON messages:</p>`,
    `<ul>`,
    `<li>Field names are case-sensitive</li>`,
    `<li>AMPS can filter on any field in the JSON payload</li>`,
    `<li>Nested objects and arrays are supported in expressions</li>`,
    `</ul>`
  ]},
  { moduleId: 'M1', type: 'concept', title: 'Introducing spark: The AMPS CLI', content: [
    `<p><code>spark</code> is the command-line client included with AMPS:</p>`,
    `<pre><code>$ ./bin/spark -server localhost:9007 -type json</code></pre>`,
    `<p>Once connected, you can:</p>`,
    `<ul>`,
    `<li><code>publish</code> — send messages to a topic</li>`,
    `<li><code>subscribe</code> — receive messages from a topic</li>`,
    `<li><code>sow</code> — query the State of the World</li>`,
    `<li><code>sow_and_subscribe</code> — query then subscribe for updates</li>`,
    `</ul>`,
    `<p>Use <code>help</code> inside spark to see all available commands.</p>`
  ]},
  { moduleId: 'M1', type: 'worked_example', title: 'Your First Publish and Subscribe', content: [
    `<p><strong>Terminal 1 — Subscribe:</strong></p>`,
    `<pre><code>spark&gt; subscribe ORDERS\nSubscribed to ORDERS</code></pre>`,
    `<p><strong>Terminal 2 — Publish:</strong></p>`,
    `<pre><code>spark&gt; publish ORDERS\nEnter message (blank line to send):\n{ "Ticker": "AAPL", "Price": 175.00 }\n\nMessage published.</code></pre>`,
    `<p><strong>Terminal 1 — Receive:</strong></p>`,
    `<pre><code>{ "Ticker": "AAPL", "Price": 175.00 }</code></pre>`,
    `<div class="callout"><div class="callout-title">🎉 Success!</div>You just sent your first message through AMPS.</div>`
  ]},
  { moduleId: 'M1', type: 'concept', title: 'Filesystem and Environment Setup', content: [
    `<p>AMPS uses the filesystem for several purposes:</p>`,
    `<table>`,
    `<tr><th>Path</th><th>Purpose</th></tr>`,
    `<tr><td>SOW files</td><td>Persistent storage for State of the World topics</td></tr>`,
    `<tr><td>Transaction log journals</td><td>Recorded message streams for replay</td></tr>`,
    `<tr><td>Log files</td><td>Server event and error logging</td></tr>`,
    `<tr><td>Minidumps</td><td>Crash diagnostics</td></tr>`,
    `</table>`,
    `<p>Use fast, local storage (SSD) for SOW and transaction log directories.</p>`
  ]},
  { moduleId: 'M1', type: 'concept', title: 'Common Installation Issues', content: [
    `<table>`,
    `<tr><th>Issue</th><th>Solution</th></tr>`,
    `<tr><td>Port already in use</td><td>Change the transport port in config or stop the other process</td></tr>`,
    `<tr><td>Permission denied</td><td>Ensure AMPS has write access to SOW and log directories</td></tr>`,
    `<tr><td>Config file not found</td><td>Verify the path passed to <code>-config</code></td></tr>`,
    `<tr><td>Out of memory</td><td>Reduce SOW topic sizes or increase system RAM</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M1', type: 'recap', title: 'Module Recap: Getting Started', content: [
    `<ul>`,
    `<li>AMPS runs on Linux x86_64; evaluation on Windows/macOS via WSL/VM</li>`,
    `<li>Start with <code>amps config.xml</code>; stop gracefully with SIGTERM</li>`,
    `<li>JSON is the most common message format — field names are case-sensitive</li>`,
    `<li><code>spark</code> is the CLI client for testing pub/sub, SOW queries, and more</li>`,
    `<li>Use fast local storage for SOW files and transaction logs</li>`,
    `</ul>`
  ]},
  { moduleId: 'M1', type: 'quiz', title: 'Quiz: Getting Started', content: [] },

  // ===== M2: Publish/Subscribe Fundamentals =====
  { moduleId: 'M2', type: 'intro', title: 'What Is Pub/Sub Messaging?', content: [
    `<p>In <strong>publish/subscribe messaging</strong>, publishers send messages without knowing which subscribers will receive them.</p>`,
    `<p>This <strong>decouples publishers from subscribers</strong> for maximum flexibility:</p>`,
    `<ul>`,
    `<li>Add new publishers without changing subscribers</li>`,
    `<li>Add new subscribers without changing publishers</li>`,
    `<li>Scale each side independently</li>`,
    `</ul>`,
    `<p>All other AMPS features build on this foundation.</p>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Topics in AMPS', content: [
    `<p>Every message in AMPS is published to a <strong>topic</strong>:</p>`,
    `<ul>`,
    `<li>The topic indicates the type of message</li>`,
    `<li>Subscribers choose which topics to receive</li>`,
    `<li>Topics are typically named after business entities (e.g., <code>ORDERS</code>, <code>TRADES</code>)</li>`,
    `</ul>`,
    `<pre><code>// Publisher sends to topic\npublish ORDERS { "Ticker": "IBM", "Price": 125 }\n\n// Subscriber receives from topic\nsubscribe ORDERS</code></pre>`,
    `<p>Topics are configured in the AMPS configuration file or created ad hoc.</p>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Ad Hoc Topics', content: [
    `<p><strong>Ad hoc topics</strong> are created automatically when a client publishes or subscribes to a topic name that doesn\'t have explicit configuration:</p>`,
    `<ul>`,
    `<li>No configuration needed in <code>amps-config.xml</code></li>`,
    `<li>Useful for prototyping and dynamic messaging</li>`,
    `<li>Messages are not persisted to the SOW unless configured</li>`,
    `</ul>`,
    `<div class="callout"><div class="callout-title">⚠️ Production Tip</div>Always configure topics explicitly in production. Ad hoc topics have no SOW, no transaction log, and no entitlement controls.</div>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Regular Expression Subscriptions', content: [
    `<p>Subscribers can match <strong>multiple topics</strong> with regular expressions:</p>`,
    `<pre><code>// Subscribe to all topics starting with "ORDERS_"\nsubscribe ORDERS_.*\n\n// Subscribe to any single character suffix\nsubscribe ORDERS_?</code></pre>`,
    `<p>This is useful when:</p>`,
    `<ul>`,
    `<li>You have many related topics (e.g., <code>ORDERS_US</code>, <code>ORDERS_EU</code>)</li>`,
    `<li>You want to dynamically discover new topics</li>`,
    `<li>You need a unified view across topic hierarchies</li>`,
    `</ul>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Message Headers Overview', content: [
    `<p>AMPS adds <strong>headers</strong> to every message. Key headers include:</p>`,
    `<table>`,
    `<tr><th>Header</th><th>Description</th></tr>`,
    `<tr><td><code>AMPS_Topic</code></td><td>The topic the message was published to</td></tr>`,
    `<tr><td><code>AMPS_MessageId</code></td><td>Unique identifier for the message</td></tr>`,
    `<tr><td><code>AMPS_Timestamp</code></td><td>Server timestamp when message was processed</td></tr>`,
    `<tr><td><code>CorrelationId</code></td><td>Application-defined correlation identifier</td></tr>`,
    `<tr><td><code>AMPS_CommandId</code></td><td>Identifier for the subscription command</td></tr>`,
    `</table>`,
    `<p>Headers are separate from the message payload and are used for routing, filtering, and tracking.</p>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Message Ordering Guarantees', content: [
    `<p>AMPS guarantees <strong>absolute message ordering within a topic</strong>:</p>`,
    `<ul>`,
    `<li>Messages are delivered to subscribers in the order they were received by AMPS</li>`,
    `<li>This applies to all subscribers on that topic</li>`,
    `<li>Ordering is also maintained within replicated topics</li>`,
    `</ul>`,
    `<p><strong>Note:</strong> For <strong>view topics</strong>, ordering is guaranteed within each view but not across separate views.</p>`,
    `<p>Subscribers can rely on message order for stateful processing.</p>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Conflated Subscriptions', content: [
    `<p><strong>Conflation</strong> reduces message volume by delivering only the <strong>latest message</strong> for a given SOW key:</p>`,
    `<ul>`,
    `<li>Useful when subscribers only need the most recent state</li>`,
    `<li>Reduces bandwidth and processing overhead</li>`,
    `<li>Configured per-subscription with the <code>conflated</code> option</li>`,
    `</ul>`,
    `<pre><code>// Subscribe with conflation\nsubscribe ORDERS with options { conflated: true }</code></pre>`,
    `<p>Conflation is often used for price feeds and status updates.</p>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Replacing Subscriptions', content: [
    `<p>A subscriber can <strong>replace</strong> an existing subscription without unsubscribing first:</p>`,
    `<ul>`,
    `<li>Replace the content filter</li>`,
    `<li>Replace the topic</li>`,
    `<li>Replace subscription options</li>`,
    `</ul>`,
    `<p>Replacement uses the same <code>CommandId</code> as the original subscription. AMPS sends a <code>group_end</code> message for the old subscription and begins the new one.</p>`,
    `<div class="callout"><div class="callout-title">💡 Pro Tip</div>Use replace to dynamically change filters at runtime — no message loss during the transition.</div>`
  ]},
  { moduleId: 'M2', type: 'concept', title: 'Select Lists: Retrieving Partial Messages', content: [
    `<p><strong>Select lists</strong> let subscribers receive only the fields they need:</p>`,
    `<pre><code>// Only receive Ticker and Price fields\nsubscribe ORDERS with selectList ["/Ticker", "/Price"]</code></pre>`,
    `<p>Benefits:</p>`,
    `<ul>`,
    `<li>Reduced bandwidth between AMPS and subscriber</li>`,
    `<li>Faster client-side processing</li>`,
    `<li>Less memory usage on the client</li>`,
    `</ul>`,
    `<p>Use <strong>AMPS expressions</strong> in select lists for computed fields.</p>`
  ]},
  { moduleId: 'M2', type: 'recap', title: 'Module Recap: Pub/Sub Fundamentals', content: [
    `<ul>`,
    `<li>Pub/sub decouples publishers and subscribers for flexibility and scale</li>`,
    `<li>Messages are sent to topics; subscribers choose which topics to receive</li>`,
    `<li>Ad hoc topics work without configuration but lack persistence and security</li>`,
    `<li>Regex subscriptions allow matching multiple topics with one command</li>`,
    `<li>AMPS guarantees absolute ordering within each topic</li>`,
    `<li>Conflation and select lists optimize bandwidth and processing</li>`,
    `</ul>`
  ]},
  { moduleId: 'M2', type: 'quiz', title: 'Quiz: Publish/Subscribe Fundamentals', content: [] },

  // ===== M3: Content Filtering & Expressions =====
  { moduleId: 'M3', type: 'intro', title: 'Why Content Filtering Matters', content: [
    `<p>Unlike many messaging systems, AMPS lets subscribers filter messages by <strong>content within the payload</strong>, not just by topic.</p>`,
    `<p>Benefits of content filtering:</p>`,
    `<ul>`,
    `<li><strong>Better bandwidth usage</strong> — subscribers only receive relevant messages</li>`,
    `<li><strong>Simpler subscriber code</strong> — guaranteed that received messages match criteria</li>`,
    `<li><strong>Looser coupling</strong> — publishers don\'t need to know what fields subscribers care about</li>`,
    `</ul>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Filter Syntax Basics', content: [
    `<p>Content filters are expressions that evaluate to <code>true</code> or <code>false</code>:</p>`,
    `<pre><code>// Simple equality filter\n/Ticker = "IBM"\n\n// Numeric comparison\n/Price &gt; 100\n\n// Combined conditions\n/Ticker = "IBM" AND /Price &gt; 100\n\n// Range filter\n/Price BETWEEN 50 AND 150</code></pre>`,
    `<p>Filters use <strong>field references</strong> like <code>/Ticker</code> and <strong>operators</strong> like <code>=</code>, <code>&gt;</code>, <code>AND</code>, <code>OR</code>.</p>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'AMPS Data Types', content: [
    `<p>AMPS supports these data types in expressions:</p>`,
    `<table>`,
    `<tr><th>Type</th><th>Examples</th><th>Notes</th></tr>`,
    `<tr><td>Integer</td><td><code>42</code>, <code>-7</code></td><td>64-bit signed integers</td></tr>`,
    `<tr><td>Floating point</td><td><code>3.14</code>, <code>-0.5</code></td><td>IEEE 754 double precision</td></tr>`,
    `<tr><td>String</td><td><code>"IBM"</code></td><td>Double-quoted, case-sensitive</td></tr>`,
    `<tr><td>Boolean</td><td><code>true</code>, <code>false</code></td><td>Lowercase literals</td></tr>`,
    `<tr><td>NULL</td><td><code>NULL</code></td><td>Represents missing value</td></tr>`,
    `<tr><td>Array</td><td><code>[1, 2, 3]</code></td><td>Used with IN operator</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Identifiers and Field References', content: [
    `<p>Field references in AMPS start with a forward slash <code>/</code>:</p>`,
    `<pre><code>/Ticker          // Top-level field\n/Order/Quantity  // Nested field\n/Tags[0]          // First element of array\n/Items[0]/Price  // Nested field within array element</code></pre>`,
    `<p>Rules:</p>`,
    `<ul>`,
    `<li>Field names are case-sensitive</li>`,
    `<li>Use brackets for array indexing</li>`,
    `<li>Use dot or slash for nested paths</li>`,
    `<li>Unquoted identifiers can contain letters, digits, and underscores</li>`,
    `</ul>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Arithmetic Operators', content: [
    `<table>`,
    `<tr><th>Operator</th><th>Description</th><th>Example</th></tr>`,
    `<tr><td><code>+</code></td><td>Addition</td><td><code>/Price + /Tax</code></td></tr>`,
    `<tr><td><code>-</code></td><td>Subtraction</td><td><code>/Total - /Discount</code></td></tr>`,
    `<tr><td><code>*</code></td><td>Multiplication</td><td><code>/Quantity * /Price</code></td></tr>`,
    `<tr><td><code>/</code></td><td>Division</td><td><code>/Total / /Count</code></td></tr>`,
    `<tr><td><code>%</code></td><td>Modulo</td><td><code>/Id % 10</code></td></tr>`,
    `</table>`,
    `<p>Arithmetic follows standard order of precedence. Use parentheses to override.</p>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Comparison Operators', content: [
    `<table>`,
    `<tr><th>Operator</th><th>Description</th></tr>`,
    `<tr><td><code>=</code></td><td>Equal to</td></tr>`,
    `<tr><td><code>&lt;&gt;</code> or <code>!=</code></td><td>Not equal to</td></tr>`,
    `<tr><td><code>&lt;</code></td><td>Less than</td></tr>`,
    `<tr><td><code>&gt;</code></td><td>Greater than</td></tr>`,
    `<tr><td><code>&lt;=</code></td><td>Less than or equal to</td></tr>`,
    `<tr><td><code>&gt;=</code></td><td>Greater than or equal to</td></tr>`,
    `<tr><td><code>BETWEEN</code></td><td>Inclusive range</td></tr>`,
    `<tr><td><code>IN</code></td><td>Match any value in list</td></tr>`,
    `<tr><td><code>LIKE</code></td><td>Pattern matching with wildcards</td></tr>`,
    `<tr><td><code>IS NULL</code></td><td>Check for NULL value</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Logical Operators', content: [
    `<table>`,
    `<tr><th>Operator</th><th>Description</th></tr>`,
    `<tr><td><code>AND</code></td><td>True if both operands are true</td></tr>`,
    `<tr><td><code>OR</code></td><td>True if either operand is true</td></tr>`,
    `<tr><td><code>NOT</code></td><td>Negates the following expression</td></tr>`,
    `</table>`,
    `<p>Precedence (highest to lowest): <code>NOT</code> → <code>AND</code> → <code>OR</code></p>`,
    `<pre><code>// Use parentheses for clarity\n(/Ticker = "IBM" OR /Ticker = "AAPL") AND /Price &gt; 100</code></pre>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'LIKE and IN Operators', content: [
    `<p><strong>LIKE</strong> performs pattern matching with two wildcards:</p>`,
    `<ul>`,
    `<li><code>%</code> — matches zero or more characters</li>`,
    `<li><code>_</code> — matches exactly one character</li>`,
    `</ul>`,
    `<pre><code>/Ticker LIKE "IB%"     // Matches IBM, IBN, etc.\n/Ticker LIKE "A_P_"    // Matches AAPL, AAPX, etc.</code></pre>`,
    `<p><strong>IN</strong> checks if a value exists in a list:</p>`,
    `<pre><code>/Ticker IN ("IBM", "AAPL", "MSFT")\n/Status IN (/AllowedStatuses)</code></pre>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'NULL, NaN, and IS NULL', content: [
    `<p>Handling missing or invalid values:</p>`,
    `<ul>`,
    `<li><strong>NULL</strong> — a field is absent or explicitly set to null</li>`,
    `<li><strong>NaN</strong> — a numeric field contains "not a number"</li>`,
    `</ul>`,
    `<pre><code>// Check for NULL\n/OptionalField IS NULL\n\n// Check for non-NULL\n/OptionalField IS NOT NULL\n\n// NaN comparisons always return false\n/NanField = /NanField  // Returns false!</code></pre>`,
    `<div class="callout"><div class="callout-title">⚠️ Important</div><code>NaN = NaN</code> returns <code>false</code> in AMPS, following IEEE 754 rules. Use <code>IS NULL</code> to check for missing values.</div>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Working with Arrays', content: [
    `<p>AMPS expressions support array operations:</p>`,
    `<pre><code>// Access by index\n/Tags[0] = "urgent"\n\n// IN operator with array literal\n/Status IN ("NEW", "PENDING", "OPEN")\n\n// Array field reference\n/AllowedValues IN (/ConfiguredList)</code></pre>`,
    `<p>For nested arrays and objects, combine bracket and dot notation:</p>`,
    `<pre><code>/Orders[0]/Items[1]/Price &gt; 100</code></pre>`
  ]},
  { moduleId: 'M3', type: 'concept', title: 'Regular Expressions in Filters', content: [
    `<p>AMPS supports <strong>regular expression matching</strong> for string fields:</p>`,
    `<pre><code>// Match ticker starting with A\n/Ticker LIKE_REGEX "^A.*"\n\n// Match 3-4 character uppercase ticker\n/Ticker LIKE_REGEX "^[A-Z]{3,4}$"</code></pre>`,
    `<p>Regular expressions follow standard PCRE-like syntax. Use them when <code>LIKE</code> wildcards aren\'t expressive enough.</p>`,
    `<div class="callout"><div class="callout-title">💡 Performance Tip</div>Regular expressions are powerful but slower than simple comparisons. Use <code>=</code>, <code>IN</code>, or <code>LIKE</code> when possible.</div>`
  ]},
  { moduleId: 'M3', type: 'recap', title: 'Module Recap: Content Filtering & Expressions', content: [
    `<ul>`,
    `<li>Content filtering lets subscribers receive only relevant messages by payload content</li>`,
    `<li>Field references start with <code>/</code> and support nested paths and array indexing</li>`,
    `<li>AMPS supports integers, floats, strings, booleans, NULL, and arrays</li>`,
    `<li>Comparison operators: <code>= &lt;&gt; &lt; &gt; &lt;= &gt;= BETWEEN IN LIKE</code></li>`,
    `<li>Logical operators: <code>AND OR NOT</code> with standard precedence</li>`,
    `<li>Use <code>IS NULL</code> for missing values; remember <code>NaN = NaN</code> is false</li>`,
    `</ul>`
  ]},
  { moduleId: 'M3', type: 'quiz', title: 'Quiz: Content Filtering & Expressions', content: [] },

  // ===== M4: State of the World (SOW) =====
  { moduleId: 'M4', type: 'intro', title: 'What Is the State of the World?', content: [
    `<p>The <strong>State of the World (SOW)</strong> is AMPS\'s integrated database capability.</p>`,
    `<p>Unlike a traditional message broker that only routes messages, AMPS can <strong>persist the latest value</strong> for each record in a topic:</p>`,
    `<ul>`,
    `<li>Acts as a <strong>current-value cache</strong></li>`,
    `<li>Works as a <strong>key/value document store</strong></li>`,
    `<li>Functions as a <strong>fully queryable database</strong></li>`,
    `</ul>`,
    `<p>You can use all three modes simultaneously for the same topic.</p>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'When to Store a Topic in the SOW', content: [
    `<p>Use the SOW when you need to:</p>`,
    `<ul>`,
    `<li><strong>Query current state</strong> — "What is the latest price for IBM?"</li>`,
    `<li><strong>Track record changes over time</strong> — update existing records</li>`,
    `<li><strong>Support delta messaging</strong> — send only changed fields</li>`,
    `<li><strong>Aggregate data</strong> — views and analytics over current state</li>`,
    `</ul>`,
    `<p>Don\'t use SOW for:</p>`,
    `<ul>`,
    `<li>Fire-and-forget events that don\'t need persistence</li>`,
    `<li>High-volume streams where only the stream matters</li>`,
    `</ul>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'How the SOW Works', content: [
    `<p>When a message is published to a SOW topic:</p>`,
    `<ol>`,
    `<li>AMPS extracts the <strong>SOW key</strong> from the message</li>`,
    `<li>Looks up the existing record with that key</li>`,
    `<li>If found, <strong>replaces</strong> the old record with the new one</li>`,
    `<li>If not found, <strong>creates</strong> a new record</li>`,
    `<li>Notifies subscribers of the change</li>`,
    `</ol>`,
    `<pre><code>Publish: { "Ticker": "IBM", "Price": 125 }  // New record\nPublish: { "Ticker": "IBM", "Price": 126 }  // Updates existing\nPublish: { "Ticker": "AAPL", "Price": 175 } // New record</code></pre>`,
    `<p>The SOW always contains the <strong>most recent message per key</strong>.</p>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'SOW Keys: AMPS-Generated vs User-Generated', content: [
    `<p>Every SOW record needs a <strong>key</strong> to identify it:</p>`,
    `<p><strong>AMPS-Generated Keys</strong></p>`,
    `<ul>`,
    `<li>AMPS automatically creates a unique key for each message</li>`,
    `<li>Useful when messages don\'t have a natural identifier</li>`,
    `<li>Configured with <code>SOW_KEY</code> or omitted key configuration</li>`,
    `</ul>`,
    `<p><strong>User-Generated Keys</strong></p>`,
    `<ul>`,
    `<li>You specify which field(s) form the key</li>`,
    `<li>Multiple fields can be combined into a composite key</li>`,
    `<li>Configured with <code>Key</code> elements in topic configuration</li>`,
    `</ul>`,
    `<pre><code>&lt;Key&gt;/Ticker&lt;/Key&gt;\n&lt;Key&gt;/Exchange&lt;/Key&gt;</code></pre>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'Indexing SOW Topics', content: [
    `<p>Indexes speed up SOW queries:</p>`,
    `<ul>`,
    `<li>Define <code>Index</code> elements in topic configuration</li>`,
    `<li>Index fields you query frequently</li>`,
    `<li>More indexes = faster queries, but more memory and slower updates</li>`,
    `</ul>`,
    `<pre><code>&lt;Index&gt;\n  &lt;Field&gt;/Ticker&lt;/Field&gt;\n&lt;/Index&gt;\n&lt;Index&gt;\n  &lt;Field&gt;/Sector&lt;/Field&gt;\n&lt;/Index&gt;</code></pre>`,
    `<div class="callout"><div class="callout-title">💡 Best Practice</div>Index the fields used in content filters and query <code>WHERE</code> clauses. Don\'t over-index.</div>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'SOW Queries', content: [
    `<p>Query the SOW to retrieve current records:</p>`,
    `<pre><code>// Query all records in a topic\nsow ORDERS\n\n// Query with a filter\nsow ORDERS where /Ticker = "IBM"\n\n// Query with multiple conditions\nsow ORDERS where /Price &gt; 100 AND /Quantity &gt; 500</code></pre>`,
    `<p>Query results are delivered as a set of messages, followed by a <code>group_end</code> message.</p>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'Query and Subscribe', content: [
    `<p><strong>Query and Subscribe</strong> combines two operations:</p>`,
    `<ol>`,
    `<li>First, AMPS sends the current SOW contents matching the query</li>`,
    `<li>Then, AMPS sends real-time updates as new messages arrive</li>`,
    `</ol>`,
    `<pre><code>sow_and_subscribe ORDERS where /Ticker = "IBM"</code></pre>`,
    `<p>This is one of the most common patterns in AMPS applications:</p>`,
    `<ul>`,
    `<li>Populate a UI with current data</li>`,
    `<li>Keep the UI updated in real-time</li>`,
    `</ul>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'Historical SOW Queries', content: [
    `<p><strong>Historical SOW queries</strong> let you retrieve past states of the SOW:</p>`,
    `<ul>`,
    `<li>Requires the topic to have a <strong>transaction log</strong></li>`,
    `<li>Use a <strong>bookmark</strong> to specify a point in time</li>`,
    `<li>Useful for auditing, backtesting, and debugging</li>`,
    `</ul>`,
    `<pre><code>// Query SOW as it existed at a specific bookmark\nsow ORDERS with bookmark "E|12345|/amps/replication"</code></pre>`,
    `<div class="callout"><div class="callout-title">⚠️ Requirement</div>Historical SOW queries require both SOW and transaction log to be configured for the topic.</div>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'Paginated SOW Subscriptions', content: [
    `<p>For large result sets, use <strong>pagination</strong>:</p>`,
    `<ul>`,
    `<li>Request a subset of records at a time</li>`,
    `<li>Use <code>topN</code> and <code>skipN</code> options</li>`,
    `<li>Combine with <code>OrderBy</code> for sorted results</li>`,
    `</ul>`,
    `<pre><code>// First page: top 10 by Price descending\nsow ORDERS with options {\n  topN: 10,\n  OrderBy: "/Price DESC"\n}</code></pre>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'Aggregated SOW Queries', content: [
    `<p>AMPS can compute <strong>aggregations</strong> over SOW topics:</p>`,
    `<ul>`,
    `<li><code>COUNT</code>, <code>MIN</code>, <code>MAX</code>, <code>SUM</code>, <code>AVG</code></li>`,
    `<li><code>GROUP BY</code> for grouping results</li>`,
    `<li>Useful for dashboards and analytics</li>`,
    `</ul>`,
    `<pre><code>// Average price per sector\nsow ORDERS with options {\n  selectList: ["/Sector", "AVG(/Price) as AvgPrice"],\n  groupBy: ["/Sector"]\n}</code></pre>`
  ]},
  { moduleId: 'M4', type: 'concept', title: 'SOW Maintenance and Expiration', content: [
    `<p>AMPS provides mechanisms to manage SOW storage:</p>`,
    `<table>`,
    `<tr><th>Feature</th><th>Description</th></tr>`,
    `<tr><td>Expiration</td><td>Automatically delete records after a configured time</td></tr>`,
    `<tr><td>Compaction</td><td>Reclaim space from deleted records</td></tr>`,
    `<tr><td>Preprocessing</td><td>Transform or validate messages before SOW update</td></tr>`,
    `<tr><td>Enrichment</td><td>Add computed fields to messages in the SOW</td></tr>`,
    `</table>`,
    `<p>Configure these in the topic definition within <code>amps-config.xml</code>.</p>`
  ]},
  { moduleId: 'M4', type: 'recap', title: 'Module Recap: State of the World', content: [
    `<ul>`,
    `<li>SOW persists the latest message per key, acting as a database</li>`,
    `<li>Use SOW when you need queries, deltas, or current-state tracking</li>`,
    `<li>Keys can be AMPS-generated or user-defined from message fields</li>`,
    `<li>Indexes speed up queries but consume memory</li>`,
    `<li><code>sow_and_subscribe</code> gives current state + real-time updates</li>`,
    `<li>Historical queries, pagination, and aggregation extend SOW capabilities</li>`,
    `</ul>`
  ]},
  { moduleId: 'M4', type: 'quiz', title: 'Quiz: State of the World (SOW)', content: [] },

  // ===== M5: Message Queues =====
  { moduleId: 'M5', type: 'intro', title: 'What Are Message Queues?', content: [
    `<p><strong>Message queues</strong> provide <strong>competitive consumption</strong> — each message is delivered to exactly one subscriber.</p>`,
    `<p>This is different from pub/sub where one message goes to all subscribers.</p>`,
    `<pre><code>Pub/Sub:     1 message → ALL subscribers\nQueue:       1 message → ONE subscriber</code></pre>`,
    `<p>Queues are ideal for <strong>work distribution</strong> and <strong>task processing</strong>.</p>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'How Queues Work in AMPS', content: [
    `<p>AMPS queues build on top of SOW topics:</p>`,
    `<ol>`,
    `<li>A topic is configured as a <strong>queue</strong></li>`,
    `<li>Messages published to the topic become available to consumers</li>`,
    `<li>Each consumer <strong>leases</strong> a message (exclusive access for a time)</li>`,
    `<li>The consumer processes the message and <strong>acknowledges</strong> it</li>`,
    `<li>If not acknowledged in time, the lease expires and another consumer gets it</li>`,
    `</ol>`,
    `<p>This ensures <strong>at-least-once delivery</strong> with automatic retry.</p>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'When to Use Queues', content: [
    `<table>`,
    `<tr><th>Scenario</th><th>Use Queue?</th></tr>`,
    `<tr><td>Task distribution to worker pool</td><td>✅ Yes</td></tr>`,
    `<tr><td>Order processing pipelines</td><td>✅ Yes</td></tr>`,
    `<tr><td>Market data broadcast</td><td>❌ Use pub/sub</td></tr>`,
    `<tr><td>Event notifications to all listeners</td><td>❌ Use pub/sub</td></tr>`,
    `<tr><td>Guaranteed processing with retry</td><td>✅ Yes</td></tr>`,
    `<tr><td>Real-time price updates</td><td>❌ Use pub/sub</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'Queue Configuration', content: [
    `<p>Configure a queue in <code>amps-config.xml</code>:</p>`,
    `<pre><code>&lt;SOW&gt;\n  &lt;Topic&gt;\n    &lt;Name&gt;WORK_QUEUE&lt;/Name&gt;\n    &lt;Queue&gt;\n      &lt;LeaseTime&gt;30s&lt;/LeaseTime&gt;\n      &lt;MaxBacklog&gt;10000&lt;/MaxBacklog&gt;\n    &lt;/Queue&gt;\n    &lt;Key&gt;/TaskId&lt;/Key&gt;\n  &lt;/Topic&gt;\n&lt;/SOW&gt;</code></pre>`,
    `<p>Key parameters:</p>`,
    `<ul>`,
    `<li><code>LeaseTime</code> — how long a consumer has exclusive access</li>`,
    `<li><code>MaxBacklog</code> — maximum queued messages</li>`,
    `</ul>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'Queue Replication Types', content: [
    `<p>AMPS supports different replication behaviors for queues:</p>`,
    `<table>`,
    `<tr><th>Type</th><th>Behavior</th></tr>`,
    `<tr><td>Local</td><td>Messages are consumed locally on each instance</td></tr>`,
    `<tr><td>Global</td><td>Messages are consumed once across the entire replication group</td></tr>`,
    `<tr><td>Group Local</td><td>Messages are consumed once within a designated group</td></tr>`,
    `</table>`,
    `<p>Choose the type based on your deployment topology and failover requirements.</p>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'Group Local Queues', content: [
    `<p><strong>Group local queues</strong> provide a balance between local and global:</p>`,
    `<ul>`,
    `<li>Messages are consumed once <strong>within a group</strong></li>`,
    `<li>Different groups can process the same message independently</li>`,
    `<li>Useful for multi-region deployments</li>`,
    `</ul>`,
    `<pre><code>&lt;Queue&gt;\n  &lt;ReplicationType&gt;group-local&lt;/ReplicationType&gt;\n  &lt;GroupName&gt;US-EAST&lt;/GroupName&gt;\n&lt;/Queue&gt;</code></pre>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'Multiple Underlying Topics', content: [
    `<p>A single queue can consume from <strong>multiple underlying topics</strong>:</p>`,
    `<ul>`,
    `<li>Aggregate work items from different sources</li>`,
    `<li>Process them with a single consumer pool</li>`,
    `<li>Configure with <code>UnderlyingTopic</code> elements</li>`,
    `</ul>`,
    `<pre><code>&lt;Queue&gt;\n  &lt;UnderlyingTopic&gt;ORDERS_US&lt;/UnderlyingTopic&gt;\n  &lt;UnderlyingTopic&gt;ORDERS_EU&lt;/UnderlyingTopic&gt;\n&lt;/Queue&gt;</code></pre>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'Queue vs Pub/Sub: Choosing a Model', content: [
    `<table>`,
    `<tr><th>Criteria</th><th>Pub/Sub</th><th>Queue</th></tr>`,
    `<tr><td>Delivery</td><td>All subscribers</td><td>One consumer</td></tr>`,
    `<tr><td>Pattern</td><td>Broadcast</td><td>Work distribution</td></tr>`,
    `<tr><td>Persistence</td><td>Optional</td><td>Required (SOW-based)</td></tr>`,
    `<tr><td>Ordering</td><td>Global per topic</td><td>Per consumer</td></tr>`,
    `<tr><td>Retry</td><td>No</td><td>Yes (lease expiry)</td></tr>`,
    `<tr><td>Scaling</td><td>Subscribers scale reads</td><td>Consumers scale processing</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M5', type: 'concept', title: 'Advanced Queue Configuration', content: [
    `<p>Additional queue options:</p>`,
    `<table>`,
    `<tr><th>Option</th><th>Description</th></tr>`,
    `<tr><td><code>Acknowledgment</code></td><td>Require explicit ack from consumer</td></tr>`,
    `<tr><td><code>MaxLeaseDuration</code></td><td>Hard limit on lease time</td></tr>`,
    `<tr><td><code>Priority</code></td><td>Process higher-priority messages first</td></tr>`,
    `<tr><td><code>Filter</code></td><td>Only queue messages matching a filter</td></tr>`,
    `</table>`,
    `<p>Fine-tune these based on your SLAs and processing requirements.</p>`
  ]},
  { moduleId: 'M5', type: 'recap', title: 'Module Recap: Message Queues', content: [
    `<ul>`,
    `<li>Queues provide competitive consumption — one message → one consumer</li>`,
    `<li>Built on SOW topics with lease-based message locking</li>`,
    `<li>Use queues for task distribution, pipelines, and guaranteed processing</li>`,
    `<li>Choose replication type: local, global, or group-local</li>`,
    `<li>Multiple underlying topics can feed a single queue</li>`,
    `<li>Configure lease time, backlog limits, and acknowledgments</li>`,
    `</ul>`
  ]},
  { moduleId: 'M5', type: 'quiz', title: 'Quiz: Message Queues', content: [] },

  // ===== M6: Advanced Messaging =====
  { moduleId: 'M6', type: 'intro', title: 'The AMPS Transaction Log', content: [
    `<p>The <strong>Transaction Log</strong> records every message that passes through AMPS with full fidelity.</p>`,
    `<p>It enables powerful capabilities:</p>`,
    `<ul>`,
    `<li><strong>Message replay</strong> — reprocess historical messages</li>`,
    `<li><strong>Bookmark subscriptions</strong> — resume from a specific point</li>`,
    `<li><strong>Replication</strong> — synchronize between AMPS instances</li>`,
    `<li><strong>Historical SOW queries</strong> — view past state</li>`,
    `</ul>`,
    `<p>The transaction log is stored in <strong>journal files</strong> on disk.</p>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'How Transaction Logging Works', content: [
    `<p>When a message is published to a topic with a transaction log:</p>`,
    `<ol>`,
    `<li>AMPS assigns a <strong>bookmark</strong> — a unique, ordered identifier</li>`,
    `<li>The message is written to the transaction log journal</li>`,
    `<li>The message is then processed (SOW update, subscriber delivery, etc.)</li>`,
    `</ol>`,
    `<pre><code>Bookmark format: E|sequence_number|source\nExample: E|12345|/amps/replication</code></pre>`,
    `<p>Bookmarks are monotonically increasing, so they define a total order.</p>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Bookmark Subscriptions and Replay', content: [
    `<p><strong>Bookmark subscriptions</strong> let you receive messages starting from any point in the log:</p>`,
    `<pre><code>// Subscribe from the beginning of the log\nsubscribe ORDERS with bookmark "0"\n\n// Subscribe from a specific bookmark\nsubscribe ORDERS with bookmark "E|12345|/amps/replication"\n\n// Subscribe from now\nsubscribe ORDERS with bookmark "now"</code></pre>`,
    `<p>Use cases:</p>`,
    `<ul>`,
    `<li>Recovering from application crashes</li>`,
    `<li>Replaying messages for testing or analytics</li>`,
    `<li>Catch-up replication</li>`,
    `</ul>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Replay from a Specific Bookmark', content: [
    `<p>AMPS provides utilities for transaction log analysis:</p>`,
    `<table>`,
    `<tr><th>Tool</th><th>Purpose</th></tr>`,
    `<tr><td><code>amps_journal_search</code></td><td>Search journal files for messages matching criteria</td></tr>`,
    `<tr><td><code>amps-grep</code></td><td>Pattern search across journal files</td></tr>`,
    `</table>`,
    `<pre><code>// Find all messages for IBM in the log\namps_journal_search --topic ORDERS --filter '/Ticker = "IBM"'</code></pre>`,
    `<p>These tools work offline on journal files without starting the AMPS server.</p>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Finding Messages with Specific Data', content: [
    `<p>You can search the transaction log for messages matching content filters:</p>`,
    `<pre><code>// Search for high-value orders\namps_journal_search --topic ORDERS \\\n  --filter '/Price &gt; 1000 AND /Quantity &gt; 10000'</code></pre>`,
    `<p>This is useful for:</p>`,
    `<ul>`,
    `<li>Debugging production issues</li>`,
    `<li>Audit and compliance</li>`,
    `<li>Recovering specific messages</li>`,
    `</ul>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Delta Publish: Sending Incremental Updates', content: [
    `<p><strong>Delta publish</strong> sends only the <strong>changed fields</strong> instead of the full message:</p>`,
    `<pre><code>// Full publish (sends entire record)\npublish ORDERS { "Ticker": "IBM", "Price": 125, "Quantity": 100 }\n\n// Delta publish (sends only changed field)\ndelta_publish ORDERS { "Ticker": "IBM", "Price": 126 }</code></pre>`,
    `<p>Benefits:</p>`,
    `<ul>`,
    `<li>Reduced bandwidth for publishers</li>`,
    `<li>Faster processing for subscribers that only need changes</li>`,
    `</ul>`,
    `<p>The SOW key must be included so AMPS knows which record to update.</p>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Delta Subscribe: Receiving Incremental Updates', content: [
    `<p><strong>Delta subscribe</strong> receives only the fields that changed:</p>`,
    `<pre><code>// Standard subscribe receives full messages\nsubscribe ORDERS\n// Receives: { "Ticker": "IBM", "Price": 126, "Quantity": 100 }\n\n// Delta subscribe receives only changes\ndelta_subscribe ORDERS\n// Receives: { "Ticker": "IBM", "Price": 126 }</code></pre>`,
    `<p>This is ideal for:</p>`,
    `<ul>`,
    `<li>UI updates where only changed fields need refresh</li>`,
    `<li>Bandwidth-constrained clients</li>`,
    `<li>Efficient caching layers</li>`,
    `</ul>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Delta Publish/Subscribe Support', content: [
    `<p>Delta messaging requires:</p>`,
    `<ul>`,
    `<li>The topic to be stored in the <strong>SOW</strong></li>`,
    `<li>AMPS must be able to compare the new message with the existing record</li>`,
    `</ul>`,
    `<p>Client considerations:</p>`,
    `<ul>`,
    `<li>Not all client libraries support delta publish/subscribe</li>`,
    `<li>Verify support in your chosen client API</li>`,
    `<li>Consider using OOF (Out-of-Focus) processing for additional flexibility</li>`,
    `</ul>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Conflated Topics', content: [
    `<p><strong>Conflated topics</strong> automatically reduce update frequency:</p>`,
    `<ul>`,
    `<li>AMPS batches updates and sends only the latest per key</li>`,
    `<li>Configured with a <strong>window</strong> and <strong>granularity</strong></li>`,
    `</ul>`,
    `<pre><code>&lt;Conflation&gt;\n  &lt;Window&gt;1s&lt;/Window&gt;\n  &lt;Granularity&gt;100ms&lt;/Granularity&gt;\n&lt;/Conflation&gt;</code></pre>`,
    `<p>Use conflated topics when subscribers don\'t need every single update.</p>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Views and Aggregation', content: [
    `<p><strong>Views</strong> are computed projections over SOW topics:</p>`,
    `<ul>`,
    `<li>Defined with aggregation functions and groupings</li>`,
    `<li>Updated in near real-time as underlying data changes</li>`,
    `<li>Subscribers can treat views just like regular topics</li>`,
    `</ul>`,
    `<pre><code>&lt;View&gt;\n  &lt;TopicName&gt;SECTOR_SUMMARY&lt;/TopicName&gt;\n  &lt;UnderlyingTopic&gt;ORDERS&lt;/UnderlyingTopic&gt;\n  &lt;Projection&gt;\n    &lt;Field&gt;/Sector&lt;/Field&gt;\n    &lt;Field&gt;SUM(/Quantity) AS TotalQty&lt;/Field&gt;\n  &lt;/Projection&gt;\n  &lt;Grouping&gt;\n    &lt;Field&gt;/Sector&lt;/Field&gt;\n  &lt;/Grouping&gt;\n&lt;/View&gt;</code></pre>`
  ]},
  { moduleId: 'M6', type: 'concept', title: 'Message Enrichment', content: [
    `<p><strong>Enrichment</strong> adds computed or looked-up fields to messages:</p>`,
    `<ul>`,
    `<li>Combine data from multiple sources</li>`,
    `<li>Add timestamps, sequences, or derived values</li>`,
    `<li>Transform message format before storage or delivery</li>`,
    `</ul>`,
    `<p>Enrichment is configured at the topic level and runs server-side.</p>`,
    `<div class="callout"><div class="callout-title">💡 Use Case</div>Add a <code>/ReceivedAt</code> timestamp to every message for latency tracking.</div>`
  ]},
  { moduleId: 'M6', type: 'recap', title: 'Module Recap: Advanced Messaging', content: [
    `<ul>`,
    `<li>Transaction log records all messages with bookmarks for replay and replication</li>`,
    `<li>Bookmark subscriptions resume from any point in the message stream</li>`,
    `<li>Delta publish/subscribe sends only changed fields, saving bandwidth</li>`,
    `<li>Conflated topics batch updates for subscribers that don\'t need every message</li>`,
    `<li>Views provide real-time aggregation over SOW topics</li>`,
    `<li>Enrichment adds computed fields server-side before storage/delivery</li>`,
    `</ul>`
  ]},
  { moduleId: 'M6', type: 'quiz', title: 'Quiz: Advanced Messaging', content: [] },

  // ===== M7: High Availability & Replication =====
  { moduleId: 'M7', type: 'intro', title: 'Why High Availability Matters', content: [
    `<p>AMPS is designed for <strong>enterprise deployment at scale</strong>. Downtime can be costly.</p>`,
    `<p>High availability features include:</p>`,
    `<ul>`,
    `<li><strong>Replication</strong> — synchronize data across multiple AMPS instances</li>`,
    `<li><strong>Automatic failover</strong> — clients reconnect to standby instances</li>`,
    `<li><strong>Guaranteed publishing</strong> — ensure critical messages are not lost</li>`,
    `<li><strong>Resynchronization</strong> — bring failed instances back up to date</li>`,
    `</ul>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Replication Basics', content: [
    `<p><strong>Replication</strong> copies messages from one AMPS instance to another:</p>`,
    `<ul>`,
    `<li><strong>Source instance</strong> — the primary that receives client messages</li>`,
    `<li><strong>Destination instance</strong> — the replica that receives copied messages</li>`,
    `<li>Replication is <strong>topic-level</strong> — choose which topics to replicate</li>`,
    `</ul>`,
    `<pre><code>┌──────────┐     replication     ┌──────────┐\n│ AMPS A   │ ─────────────────▶ │ AMPS B   │\n│ (source) │                    │ (dest)   │\n└──────────┘                    └──────────┘</code></pre>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Benefits of Replication', content: [
    `<table>`,
    `<tr><th>Benefit</th><th>Description</th></tr>`,
    `<tr><td>Disaster recovery</td><td>Standby instance takes over if primary fails</td></tr>`,
    `<tr><td>Load distribution</td><td>Spread read load across replicas</td></tr>`,
    `<tr><td>Geographic distribution</td><td>Place data closer to users in different regions</td></tr>`,
    `<tr><td>Maintenance windows</td><td>Upgrade one instance while others serve traffic</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Replication Resynchronization', content: [
    `<p>When a replica comes back online after a failure:</p>`,
    `<ol>`,
    `<li>AMPS detects the replica is behind</li>`,
    `<li>Automatically sends missing messages from the transaction log</li>`,
    `<li>The replica catches up to the current state</li>`,
    `<li>Normal replication resumes</li>`,
    `</ol>`,
    `<p>This happens <strong>automatically</strong> — no manual intervention required.</p>`,
    `<div class="callout"><div class="callout-title">💡 Note</div>Resynchronization requires the source to retain transaction log journals long enough for the replica to catch up.</div>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Two-Way Replication', content: [
    `<p><strong>Two-way replication</strong> allows both instances to accept writes:</p>`,
    `<ul>`,
    `<li>Each instance replicates to the other</li>`,
    `<li>Messages from Instance A are marked so they don\'t loop back</li>`,
    `<li>Useful for active-active deployments</li>`,
    `</ul>`,
    `<pre><code>┌──────────┐  replication  ┌──────────┐\n│ AMPS A   │ ◀───────────▶ │ AMPS B   │\n└──────────┘               └──────────┘</code></pre>`,
    `<p>Requires careful configuration to avoid conflicts on SOW updates.</p>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'PassThrough Replication', content: [
    `<p><strong>PassThrough replication</strong> chains instances together:</p>`,
    `<ul>`,
    `<li>Instance A replicates to B</li>`,
    `<li>Instance B replicates to C</li>`,
    `<li>Instance C receives messages from both A and B</li>`,
    `</ul>`,
    `<pre><code>┌──────────┐    ┌──────────┐    ┌──────────┐\n│ AMPS A   │───▶│ AMPS B   │───▶│ AMPS C   │\n└──────────┘    └──────────┘    └──────────┘</code></pre>`,
    `<p>Useful for hub-and-spoke or tiered deployment topologies.</p>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Replication Security', content: [
    `<p>Secure replication with:</p>`,
    `<ul>`,
    `<li><strong>TLS/SSL</strong> — encrypt replication traffic</li>`,
    `<li><strong>Authentication</strong> — verify replica identity</li>`,
    `<li><strong>Access control</strong> — restrict which topics can be replicated</li>`,
    `</ul>`,
    `<pre><code>&lt;Replication&gt;\n  &lt;Destination&gt;\n    &lt;Transport&gt;\n      &lt;Type&gt;amps-replication&lt;/Type&gt;\n      &lt;Encrypted>true&lt;/Encrypted&gt;\n    &lt;/Transport&gt;\n  &lt;/Destination&gt;\n&lt;/Replication&gt;</code></pre>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Guaranteed Publishing', content: [
    `<p><strong>Guaranteed publishing</strong> ensures critical messages are persisted before acknowledgment:</p>`,
    `<ul>`,
    `<li>Publisher waits for AMPS to confirm the message is in the transaction log</li>`,
    `<li>Prevents message loss during publisher or AMPS crashes</li>`,
    `<li>Slightly higher latency than standard publish</li>`,
    `</ul>`,
    `<pre><code>// Enable guaranteed publish\npublish ORDERS with options {\n  guaranteed: true\n}</code></pre>`
  ]},
  { moduleId: 'M7', type: 'concept', title: 'Durable Publishing and Heartbeats', content: [
    `<p><strong>Durable publishing</strong> goes further:</p>`,
    `<ul>`,
    `<li>Messages are stored locally by the publisher until acknowledged</li>`,
    `<li>Survives publisher application restarts</li>`,
    `<li>Combined with heartbeats to detect disconnections</li>`,
    `</ul>`,
    `<p><strong>Heartbeats</strong> maintain connection health:</p>`,
    `<ul>`,
    `<li>Regular ping/pong between client and AMPS</li>`,
    `<li>Detect network partitions or unresponsive peers</li>`,
    `<li>Trigger reconnection and failover</li>`,
    `</ul>`
  ]},
  { moduleId: 'M7', type: 'recap', title: 'Module Recap: High Availability & Replication', content: [
    `<ul>`,
    `<li>Replication copies messages between AMPS instances for HA and scale</li>`,
    `<li>Automatic resynchronization brings failed replicas back online</li>`,
    `<li>Two-way replication supports active-active deployments</li>`,
    `<li>PassThrough chains instances for tiered topologies</li>`,
    `<li>Use TLS and authentication to secure replication</li>`,
    `<li>Guaranteed and durable publishing prevent message loss</li>`,
    `<li>Heartbeats detect failures and trigger failover</li>`,
    `</ul>`
  ]},
  { moduleId: 'M7', type: 'quiz', title: 'Quiz: High Availability & Replication', content: [] },

  // ===== M8: Configuration & Administration =====
  { moduleId: 'M8', type: 'intro', title: 'Configuration File Overview', content: [
    `<p>AMPS behavior is controlled by an <strong>XML configuration file</strong>:</p>`,
    `<pre><code>&lt;AMPSConfig&gt;\n  &lt;Name&gt;my-amps-instance&lt;/Name&gt;\n  &lt;Transports&gt;...&lt;/Transports&gt;\n  &lt;SOW&gt;...&lt;/SOW&gt;\n  &lt;Monitoring&gt;...&lt;/Monitoring&gt;\n  &lt;Replication&gt;...&lt;/Replication&gt;\n&lt;/AMPSConfig&gt;</code></pre>`,
    `<p>The configuration file is the single source of truth for an AMPS instance.</p>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Instance-Level Configuration', content: [
    `<p>Top-level settings control the AMPS process:</p>`,
    `<table>`,
    `<tr><th>Setting</th><th>Description</th></tr>`,
    `<tr><td><code>Name</code></td><td>Unique instance name</td></tr>`,
    `<tr><td><code>Minidump</code></td><td>Enable crash dump generation</td></tr>`,
    `<tr><td><code>SlowClient</code></td><td>Policy for slow subscribers (disconnect, buffer, etc.)</td></tr>`,
    `<tr><td><code>ThreadPoolSize</code></td><td>Number of worker threads</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Transport Configuration', content: [
    `<p><strong>Transports</strong> define how clients connect to AMPS:</p>`,
    `<pre><code>&lt;Transport&gt;\n  &lt;Name&gt;json-tcp&lt;/Name&gt;\n  &lt;Type&gt;tcp&lt;/Type&gt;\n  &lt;InetAddr&gt;9007&lt;/InetAddr&gt;\n  &lt;Protocol&gt;amps&lt;/Protocol&gt;\n  &lt;MessageType&gt;json&lt;/MessageType&gt;\n&lt;/Transport&gt;</code></pre>`,
    `<p>Each transport specifies:</p>`,
    `<ul>`,
    `<li><strong>Type</strong> — tcp, multicast, etc.</li>`,
    `<li><strong>InetAddr</strong> — port (and optionally host)</li>`,
    `<li><strong>Protocol</strong> — amps, fix, nvfix, etc.</li>`,
    `<li><strong>MessageType</strong> — json, xml, bflat, etc.</li>`,
    `</ul>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Protocols and Message Formats', content: [
    `<table>`,
    `<tr><th>Protocol</th><th>Use Case</th></tr>`,
    `<tr><td>amps</td><td>Native AMPS protocol (most common)</td></tr>`,
    `<tr><td>fix</td><td>Financial FIX protocol</td></tr>`,
    `<tr><td>nvfix</td><td>Name-value FIX variant</td></tr>`,
    `</table>`,
    `<table>`,
    `<tr><th>Message Type</th><th>Use Case</th></tr>`,
    `<tr><td>json</td><td>Modern web APIs, human-readable</td></tr>`,
    `<tr><td>xml</td><td>Legacy systems, schema validation</td></tr>`,
    `<tr><td>bflat</td><td>High-performance binary format</td></tr>`,
    `<tr><td>fix</td><td>Financial industry standard</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'SOW and Topic Configuration', content: [
    `<p>Configure SOW topics with persistence and indexing:</p>`,
    `<pre><code>&lt;SOW&gt;\n  &lt;Topic&gt;\n    &lt;Name&gt;ORDERS&lt;/Name&gt;\n    &lt;MessageType&gt;json&lt;/MessageType&gt;\n    &lt;Key&gt;/OrderId&lt;/Key&gt;\n    &lt;Index&gt;\n      &lt;Field&gt;/Ticker&lt;/Field&gt;\n    &lt;/Index&gt;\n    &lt;FileName&gt;sow/orders.sow&lt;/FileName&gt;\n  &lt;/Topic&gt;\n&lt;/SOW&gt;</code></pre>`,
    `<p>Key elements: <code>Name</code>, <code>MessageType</code>, <code>Key</code>, <code>Index</code>, <code>FileName</code></p>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Monitoring with Galvanometer', content: [
    `<p><strong>Galvanometer</strong> is AMPS\'s RESTful monitoring interface:</p>`,
    `<ul>`,
    `<li>Access statistics via HTTP GET requests</li>`,
    `<li>JSON output for easy integration</li>`,
    `<li>No additional software required</li>`,
    `</ul>`,
    `<pre><code>// Get instance statistics\ncurl http://localhost:8085/amps/json/.json\n\n// Get topic statistics\ncurl http://localhost:8085/amps/json/topic?name=ORDERS</code></pre>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Event Topics and Logging', content: [
    `<p>AMPS publishes <strong>event topics</strong> for operational visibility:</p>`,
    `<table>`,
    `<tr><th>Event Topic</th><th>Purpose</th></tr>`,
    `<tr><td><code>/AMPS/ClientStatus</code></td><td>Client connect/disconnect events</td></tr>`,
    `<tr><td><code>/AMPS/SOWStats</code></td><td>SOW statistics updates</td></tr>`,
    `<tr><td><code>/AMPS/Replication</code></td><td>Replication status changes</td></tr>`,
    `</table>`,
    `<p>Subscribe to these topics for real-time operational monitoring.</p>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Actions and Automation', content: [
    `<p><strong>Actions</strong> let AMPS respond to events automatically:</p>`,
    `<ul>`,
    `<li>Trigger on: SOW expiration, client connect, message publish, etc.</li>`,
    `<li>Actions can: publish a message, run a script, log an event</li>`,
    `</ul>`,
    `<pre><code>&lt;Action&gt;\n  &lt;On&gt; sow_expire &lt;/On&gt;\n  &lt;Do&gt; publish &lt;/Do&gt;\n  &lt;Topic&gt;/AMPS/ExpiredOrders&lt;/Topic&gt;\n&lt;/Action&gt;</code></pre>`
  ]},
  { moduleId: 'M8', type: 'concept', title: 'Slow Client Policies', content: [
    `<p>When a subscriber can\'t keep up, AMPS uses a <strong>slow client policy</strong>:</p>`,
    `<table>`,
    `<tr><th>Policy</th><th>Behavior</th></tr>`,
    `<tr><td>disconnect</td><td>Close the connection</td></tr>`,
    `<tr><td>buffer</td><td>Buffer messages in memory (limited)</td></tr>`,
    `<tr><td>conflate</td><td>Drop older messages, keep latest</td></tr>`,
    `<tr><td>pause</td><td>Pause delivery until client catches up</td></tr>`,
    `</table>`,
    `<p>Configure at the transport or instance level.</p>`
  ]},
  { moduleId: 'M8', type: 'recap', title: 'Module Recap: Configuration & Administration', content: [
    `<ul>`,
    `<li>AMPS is configured via XML with sections for transports, SOW, monitoring, and replication</li>`,
    `<li>Transports define protocol, port, and message type for client connections</li>`,
    `<li>SOW topics need keys, indexes, and file paths for persistence</li>`,
    `<li>Galvanometer provides RESTful statistics via HTTP</li>`,
    `<li>Event topics publish real-time operational events</li>`,
    `<li>Actions automate responses to system events</li>`,
    `<li>Slow client policies prevent one subscriber from degrading the system</li>`,
    `</ul>`
  ]},
  { moduleId: 'M8', type: 'quiz', title: 'Quiz: Configuration & Administration', content: [] },

  // ===== M9: Security & Best Practices =====
  { moduleId: 'M9', type: 'intro', title: 'Security Overview', content: [
    `<p>AMPS provides a comprehensive security model:</p>`,
    `<ul>`,
    `<li><strong>Authentication</strong> — verify who is connecting</li>`,
    `<li><strong>Entitlements</strong> — control what they can do</li>`,
    `<li><strong>Transport encryption</strong> — protect data in transit</li>`,
    `</ul>`,
    `<p>Security is configured in the AMPS configuration file and can be changed at runtime.</p>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Authentication Modules', content: [
    `<p>AMPS supports multiple authentication mechanisms via <strong>loadable modules</strong>:</p>`,
    `<table>`,
    `<tr><th>Module</th><th>Description</th></tr>`,
    `<tr><td>Simple Access</td><td>Username/password in config file</td></tr>`,
    `<tr><td>OAuth</td><td>OAuth 2.0 / OpenID Connect integration</td></tr>`,
    `<tr><td>LDAP</td><td>Directory service authentication</td></tr>`,
    `<tr><td>Kerberos</td><td>Enterprise single sign-on</td></tr>`,
    `<tr><td>Custom</td><td>Write your own module in C++</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Simple Access Module', content: [
    `<p>The <strong>Simple Access Module</strong> is the easiest way to get started:</p>`,
    `<pre><code>&lt;Authentication&gt;\n  &lt;Module&gt;amps-simple-auth&lt;/Module&gt;\n  &lt;Parameters&gt;\n    &lt;User&gt;\n      &lt;Name&gt;admin&lt;/Name&gt;\n      &lt;Password&gt;secret123&lt;/Password&gt;\n    &lt;/User&gt;\n  &lt;/Parameters&gt;\n&lt;/Authentication&gt;</code></pre>`,
    `<div class="callout"><div class="callout-title">⚠️ Security Warning</div>Never use Simple Access in production. Use OAuth, LDAP, or a custom module instead.</div>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'OAuth Authentication', content: [
    `<p><strong>OAuth</strong> integrates AMPS with external identity providers:</p>`,
    `<ul>`,
    `<li>Clients obtain tokens from an OAuth provider</li>`,
    `<li>AMPS validates tokens via HTTP(S) to the provider</li>`,
    `<li>Supports token refresh and expiration</li>`,
    `</ul>`,
    `<pre><code>&lt;Authentication&gt;\n  &lt;Module&gt;amps-oauth-auth&lt;/Module&gt;\n  &lt;Parameters&gt;\n    &lt;TokenInfoEndpoint&gt;\n      https://auth.example.com/oauth/tokeninfo\n    &lt;/TokenInfoEndpoint&gt;\n  &lt;/Parameters&gt;\n&lt;/Authentication&gt;</code></pre>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Entitlements and Permissions', content: [
    `<p><strong>Entitlements</strong> control what authenticated users can do:</p>`,
    `<table>`,
    `<tr><th>Permission</th><th>Controls</th></tr>`,
    `<tr><td>publish</td><td>Which topics the user can publish to</td></tr>`,
    `<tr><td>subscribe</td><td>Which topics the user can subscribe to</td></tr>`,
    `<tr><td>sow</td><td>Which SOW topics the user can query</td></tr>`,
    `<tr><td>queue</td><td>Which queues the user can consume from</td></tr>`,
    `<tr><td>admin</td><td>Administrative commands and actions</td></tr>`,
    `</table>`,
    `<p>Entitlements can be static (in config) or dynamic (from an external service).</p>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Replication Transport Permissions', content: [
    `<p>Replication transports need special security configuration:</p>`,
    `<ul>`,
    `<li>Restrict replication to known peers</li>`,
    `<li>Use TLS certificates for mutual authentication</li>`,
    `<li>Limit which topics can be replicated</li>`,
    `</ul>`,
    `<pre><code>&lt;Replication&gt;\n  &lt;Destination&gt;\n    &lt;Transport&gt;\n      &lt;Type&gt;amps-replication&lt;/Type&gt;\n      &lt;Encrypted&gt;true&lt;/Encrypted&gt;\n      &lt;Certificate&gt;/path/to/cert.pem&lt;/Certificate&gt;\n    &lt;/Transport&gt;\n  &lt;/Destination&gt;\n&lt;/Replication&gt;</code></pre>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Performance Best Practices', content: [
    `<table>`,
    `<tr><th>Practice</th><th>Recommendation</th></tr>`,
    `<tr><td>Message size</td><td>Keep messages small; large messages increase latency</td></tr>`,
    `<tr><td>Content filters</td><td>Use simple comparisons over regex when possible</td></tr>`,
    `<tr><td>SOW indexes</td><td>Index frequently queried fields only</td></tr>`,
    `<tr><td>Transaction log</td><td>Use fast SSD storage for journal files</td></tr>`,
    `<tr><td>Networking</td><td>Use dedicated network interfaces for replication</td></tr>`,
    `<tr><td>Batching</td><td>Batch small publishes when throughput matters</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Capacity Testing Guidelines', content: [
    `<p>When evaluating AMPS performance:</p>`,
    `<ol>`,
    `<li><strong>Use realistic data</strong> — match message sizes and complexity to production</li>`,
    `<li><strong>Compare equivalent work</strong> — test the same operations across systems</li>`,
    `<li><strong>Use AMPS capabilities</strong> — leverage content filtering, conflation, and queues</li>`,
    `<li><strong>Test underlying hardware</strong> — CPU, memory, disk, and network all matter</li>`,
    `<li><strong>Measure end-to-end latency</strong> — not just server-side processing</li>`,
    `</ol>`,
    `<p>Refer to the AMPS Evaluation Guide for detailed testing methodology.</p>`
  ]},
  { moduleId: 'M9', type: 'concept', title: 'Common Pitfalls and Anti-Patterns', content: [
    `<table>`,
    `<tr><th>Pitfall</th><th>Solution</th></tr>`,
    `<tr><td>No SOW key specified</td><td>Always define keys for SOW topics</td></tr>`,
    `<tr><td>Over-indexing</td><td>Index only fields used in filters</td></tr>`,
    `<tr><td>Ignoring slow clients</td><td>Configure appropriate policies</td></tr>`,
    `<tr><td>Not using guaranteed publish</td><td>Use for critical messages</td></tr>`,
    `<tr><td>Ad hoc topics in production</td><td>Configure all topics explicitly</td></tr>`,
    `<tr><td>Not testing failover</td><td>Regularly test HA scenarios</td></tr>`,
    `</table>`
  ]},
  { moduleId: 'M9', type: 'chapter_summary', title: 'Course Summary and Next Steps', content: [
    `<p>You\'ve completed the AMPS Developer Onboarding! Here\'s what you learned:</p>`,
    `<ol>`,
    `<li><strong>M0</strong> — AMPS is a high-performance message processing system</li>`,
    `<li><strong>M1</strong> — Installation, starting AMPS, and the spark CLI</li>`,
    `<li><strong>M2</strong> — Pub/sub fundamentals: topics, filters, ordering</li>`,

    `<li><strong>M4</strong> — State of the World for persistence and queries</li>`,
    `<li><strong>M5</strong> — Message queues for competitive consumption</li>`,
    `<li><strong>M6</strong> — Transaction logs, delta messaging, views</li>`,
    `<li><strong>M7</strong> — High availability through replication</li>`,
    `<li><strong>M8</strong> — Configuration, monitoring, and administration</li>`,
    `<li><strong>M9</strong> — Security, performance, and best practices</li>`,
    `</ol>`,
    `<p><strong>Next steps:</strong></p>`,
    `<ul>`,
    `<li>Build a prototype with the spark CLI</li>`,
    `<li>Explore the client API for your language</li>`,
    `<li>Read the full User Guide for advanced topics</li>`,
    `<li>Take the Final Exam to test your knowledge!</li>`,
    `</ul>`
  ]},
  { moduleId: 'M9', type: 'quiz', title: 'Quiz: Security & Best Practices', content: [] },

// ---------------------------------------------------------------------------
// Storage (localStorage with cookie fallback)

function saveProgress() {
  const data = JSON.stringify(state.progress);
  try {
    localStorage.setItem(STORE_KEY, data);
  } catch (e) {
    document.cookie = STORE_KEY + '=' + encodeURIComponent(data) + '; path=/; max-age=31536000';
  }
}

function loadProgress() {
  let data = null;
  try {
    data = localStorage.getItem(STORE_KEY);
  } catch (e) {}
  if (!data) {
    const match = document.cookie.match(new RegExp('(?:^|; )' + STORE_KEY + '=([^;]*)'));
    if (match) data = decodeURIComponent(match[1]);
  }
  if (data) {
    try {
      return JSON.parse(data);
    } catch (e) {}
  }
  return initProgress();
}

function initProgress() {
  const modules = {};
  for (let i = 0; i < MODULE_NAMES.length; i++) {
    const modId = 'M' + i;
    const slideCount = SLIDES.filter(s => s.moduleId === modId).length;
    modules[modId] = {
      slides_completed: 0,
      total_slides: slideCount,
      quiz_attempted: false,
      first_attempt_score: 0,
      total_questions: QUIZ_DATA[modId] ? QUIZ_DATA[modId].length : 0,
      failed_questions: [],
      retry_completed: false,
      recovered_questions: [],
      mastery_percentage: 0,
    };
  }
  return {
    modules: modules,
    streak_days: 0,
    last_study_date: null,
    total_modules_completed: 0,
    total_modules: MODULE_NAMES.length,
    achievements: [

      { id: 'perfect-score', title: 'Star Student', emoji: '⭐', unlocked: false },
      { id: 'comeback', title: 'Comeback Kid', emoji: '🔄', unlocked: false },
      { id: 'final-exam', title: 'Champion', emoji: '🏆', unlocked: false },

function unlockAchievement(id) {
  const ach = state.progress.achievements.find(a => a.id === id);
  if (ach && !ach.unlocked) {
    ach.unlocked = true;
    saveProgress();
    showConfetti(10);
  }
}

function checkAchievements() {
  const p = state.progress;
  // First slide
  const anySlide = Object.values(p.modules).some(m => m.slides_completed > 0);
  if (anySlide) unlockAchievement('first-slide');
  // First quiz
  const anyQuiz = Object.values(p.modules).some(m => m.quiz_attempted);
  if (anyQuiz) unlockAchievement('first-quiz');
  // Streak
  if (p.streak_days >= 3) unlockAchievement('streak-3');
  // Perfect score
  const anyPerfect = Object.values(p.modules).some(m => m.first_attempt_score === m.total_questions && m.total_questions > 0);
  if (anyPerfect) unlockAchievement('perfect-score');
  // Comeback kid
  const anyComeback = Object.values(p.modules).some(m => m.retry_completed && m.recovered_questions.length > 0);
  if (anyComeback) unlockAchievement('comeback');
  // Champion
  if (p.final_exam_completed && p.final_exam_score >= 40) unlockAchievement('final-exam');
}

function updateStreak() {
  const today = new Date().toISOString().split('T')[0];
  const last = state.progress.last_study_date;
  if (!last) {
    state.progress.streak_days = 1;
  } else if (last === today) {
    // same day, no change
  } else {
    const lastDate = new Date(last);
    const todayDate = new Date(today);
    const diff = (todayDate - lastDate) / (1000 * 60 * 60 * 24);
    if (diff === 1) {
      state.progress.streak_days += 1;
    } else {
      state.progress.streak_days = 1;
    }
  }
  state.progress.last_study_date = today;
}

// ---------------------------------------------------------------------------
// Shuffle with seed
// ---------------------------------------------------------------------------
function seededRandom(seed) {
  let x = Math.sin(seed) * 10000;
  return x - Math.floor(x);
}

function shuffleArray(array, seed) {
  const arr = array.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom(seed + i) * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Module & Slide Helpers
// ---------------------------------------------------------------------------
function getModuleSlides(moduleId) {
  return SLIDES.filter(s => s.moduleId === moduleId);
}

function getModuleQuizSlides(moduleId) {
  return SLIDES.filter(s => s.moduleId === moduleId && s.type === 'quiz');
}

function getOverallSlideCount() {
  return SLIDES.filter(s => !['dashboard', 'final_exam_intro', 'final_exam_quiz'].includes(s.type)).length;
}

function getCompletedSlideCount() {
  let count = 0;
  for (const modId in state.progress.modules) {
    count += state.progress.modules[modId].slides_completed;
  }
  return count;
}

function getModuleForSlideIndex(idx) {
  return SLIDES[idx] ? SLIDES[idx].moduleId : null;
}

function getSlideIndexById(moduleId, type) {
  return SLIDES.findIndex(s => s.moduleId === moduleId && s.type === type);
}

function getFirstSlideOfModule(moduleId) {
  return SLIDES.findIndex(s => s.moduleId === moduleId);
}

function markSlideCompleted(idx) {
  const slide = SLIDES[idx];
  if (!slide || slide.moduleId === 'dashboard' || slide.moduleId === 'final') return;
  const mod = state.progress.modules[slide.moduleId];
  if (!mod) return;
  // Count unique slides completed
  const moduleSlides = getModuleSlides(slide.moduleId);
  const seen = new Set();
  for (let i = 0; i <= idx; i++) {
    if (SLIDES[i].moduleId === slide.moduleId) {
      seen.add(i);
    }
  }
  mod.slides_completed = Math.max(mod.slides_completed, seen.size);
  // Cap at total
  mod.slides_completed = Math.min(mod.slides_completed, mod.total_slides);
  // Check module completion
  if (mod.slides_completed >= mod.total_slides && mod.quiz_attempted) {
    const modIndex = parseInt(slide.moduleId.replace('M', ''));
    if (!isNaN(modIndex)) {
      // module completed
    }
  }
  updateOverallPercentage();
  saveProgress();
}

function updateOverallPercentage() {
  let totalSlides = 0;
  let completedSlides = 0;
  let totalQuizzes = 0;
  let completedQuizzes = 0;
  for (const modId in state.progress.modules) {
    const m = state.progress.modules[modId];
    totalSlides += m.total_slides;
    completedSlides += m.slides_completed;
    totalQuizzes += 1;
    if (m.quiz_attempted) completedQuizzes += 1;
  }
  const slidePct = totalSlides > 0 ? completedSlides / totalSlides : 0;
  const quizPct = totalQuizzes > 0 ? completedQuizzes / totalQuizzes : 0;
  state.progress.overall_percentage = Math.round(((slidePct + quizPct) / 2) * 100);
  state.progress.total_modules_completed = completedQuizzes;
}

// ---------------------------------------------------------------------------
function showConfetti(count = 30) {
  const colors = ['#FF6B6B', '#4ECDC4', '#FFD93D', '#9B59B6', '#2ECC71', '#3498DB'];
  for (let i = 0; i < count; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 2 + 's';
    piece.style.width = (6 + Math.random() * 8) + 'px';
    piece.style.height = piece.style.width;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 5000);
  }
}
