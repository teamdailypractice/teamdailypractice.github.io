  html += renderNavBar(slide);
  html += renderTOC();

  app.innerHTML = html;

  // KaTeX render
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(app, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}] });
  }
}

function renderHeader() {
  const totalSlides = getOverallSlideCount();
  const completed = getCompletedSlideCount();
  const pct = totalSlides > 0 ? Math.round((completed / totalSlides) * 100) : 0;
  const p = state.progress;
  return `
    <div class="header">
      <h1>📚 AMPS 5.3.5 Onboarding</h1>
      <div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>
      <div class="streak">${p.streak_days > 0 ? '🔥 ' + p.streak_days + ' day' + (p.streak_days > 1 ? 's' : '') : ''}</div>
    </div>
  `;
}

function renderDashboard() {
  const p = state.progress;
  let modulesHtml = '';
  for (let i = 0; i < MODULE_NAMES.length; i++) {
    const modId = 'M' + i;
    const mod = p.modules[modId];
    const modSlides = getModuleSlides(modId);
    const firstSlideIdx = getFirstSlideOfModule(modId);
    const pct = mod.total_slides > 0 ? Math.round((mod.slides_completed / mod.total_slides) * 100) : 0;
    const isCompleted = mod.quiz_attempted && mod.slides_completed >= mod.total_slides;
    const statusEmoji = isCompleted ? '✅' : (mod.slides_completed > 0 ? '▶️' : '🔒');
    modulesHtml += `
      <div class="module-card ${isCompleted ? 'completed' : ''}" onclick="go(${firstSlideIdx})">
        <div class="module-card-header">
          <span class="module-number">${MODULE_NAMES[i]}</span>
          <span class="module-status">${statusEmoji}</span>
        </div>
        <div class="module-title">${MODULE_NAMES[i].split(': ')[1]}</div>
        <div class="module-progress"><div class="fill" style="width:${pct}%"></div></div>
        <div style="font-size:0.8rem;color:#888;margin-top:4px;">${mod.slides_completed}/${mod.total_slides} slides • ${mod.quiz_attempted ? mod.first_attempt_score + '/' + mod.total_questions + ' quiz' : 'quiz not taken'}</div>
      </div>
    `;
  }

  const achievementsHtml = p.achievements.map(a => `
    <div class="achievement ${a.unlocked ? '' : 'locked'}">
      <span class="achievement-icon">${a.emoji}</span>
      <span>${a.title}</span>
    </div>
  `).join('');

  const allModulesDone = Object.values(p.modules).every(m => m.quiz_attempted && m.slides_completed >= m.total_slides);

  return `
    <div class="dashboard">
      <h2>🚀 Welcome, Developer!</h2>
      <p>Master AMPS 5.3.5 with interactive slides, quizzes, and a final exam.</p>
      <div class="achievements-bar">${achievementsHtml}</div>
      <div class="module-grid">${modulesHtml}</div>
      <button class="final-exam-btn" ${allModulesDone ? '' : 'disabled'} onclick="startFinalExam()">
        🏆 Take Final Exam ${allModulesDone ? '' : '(Complete all modules first)'}
      </button>
    </div>
  `;
}

function renderSlideContent(slide) {
  const typeLabels = {
    intro: 'Intro',
    concept: 'Concept',
    definition: 'Definition',
    diagram_explanation: 'Diagram',
    formula_explanation: 'Formula',
    worked_example: 'Example',
    table_explanation: 'Table',
    real_world_example: 'Real World',
    mini_activity: 'Activity',
    recap: 'Recap',
    chapter_summary: 'Summary',
  };
  const badgeClass = 'badge-' + (typeLabels[slide.type] ? slide.type : 'concept');
  const badgeText = typeLabels[slide.type] || 'Content';
  const content = slide.content ? slide.content.join('') : '';
  return `
    <div class="slide-type-badge ${badgeClass}">${badgeText}</div>
    <h2 class="slide-title">${slide.title}</h2>
    <div class="slide-content">${content}</div>
  `;
}

function renderQuiz(moduleId) {
  const questions = QUIZ_DATA[moduleId];
  if (!questions) return '<p>No quiz available.</p>';
  const mod = state.progress.modules[moduleId];

  // Check if showing results
  if (state.quizMode && state.quizCurrentQuestion >= questions.length && !state.quizRetryMode) {
    return renderQuizResults(moduleId);
  }
  if (state.quizRetryMode && state.quizCurrentQuestion >= state.quizRetryQuestions.length) {
    return renderQuizRetryResults(moduleId);
  }

  const qList = state.quizRetryMode ? state.quizRetryQuestions : questions;
  const qIdx = state.quizCurrentQuestion;
  const q = qList[qIdx];
  const shuffled = shuffleArray(q.options.map((opt, i) => ({opt, idx: i})), q.questionId.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
  const total = qList.length;

  let html = `
    <div class="slide-type-badge badge-quiz">Quiz</div>
    <h2 class="slide-title">${state.quizRetryMode ? 'Retry Failed Questions' : MODULE_NAMES[parseInt(moduleId.replace('M',''))]}</h2>
    <div class="quiz-container">
      <div style="margin-bottom:16px;font-size:0.9rem;color:#666;">Question ${qIdx + 1} of ${total}</div>
      <div class="quiz-question">${q.question}</div>
  `;

  shuffled.forEach((item, i) => {
    html += `<button class="quiz-option" id="opt-${i}" onclick="answerQuiz(${item.idx}, ${i})">${item.opt}</button>`;
  });

  html += `<div id="quiz-explanation" style="display:none;" class="quiz-explanation"></div>`;
  html += '</div>';
  return html;
}

function renderQuizResults(moduleId) {
  const questions = QUIZ_DATA[moduleId];
  const answers = state.quizAnswers;
  let correct = 0;
  const failed = [];
  answers.forEach((a, i) => {
    if (a === questions[i].correctAnswer) {
      correct++;
    } else {
      failed.push(questions[i].questionId);
    }
  });

  const mod = state.progress.modules[moduleId];
  mod.quiz_attempted = true;
  mod.first_attempt_score = correct;
  mod.failed_questions = failed;
  mod.mastery_percentage = Math.round((correct / questions.length) * 100);
  updateOverallPercentage();
  saveProgress();
  checkAchievements();

  const msg = correct >= 8 ? '🎉 Excellent work!' : correct >= 6 ? '👍 Good job!' : '💪 Keep practicing!';

  let html = `
    <div class="quiz-result">
      <div class="quiz-result-score">${correct}/${questions.length}</div>
      <div class="quiz-result-message">${msg}</div>
      <p>${correct >= 8 ? 'You have a solid grasp of this module.' : 'Review the slides and try again to improve your score.'}</p>
  `;
  if (failed.length > 0) {
    html += `<button class="nav-btn btn-quiz" onclick="startRetry('${moduleId}')">🔄 Retry Failed Questions (${failed.length})</button>`;
  }
  html += `<button class="nav-btn btn-next" onclick="goToDashboard()">🏠 Back to Dashboard</button>`;
  html += '</div>';

  if (correct === questions.length) {
    showConfetti(50);
    unlockAchievement('perfect-score');
  }

  return html;
}

function renderQuizRetryResults(moduleId) {
  const questions = QUIZ_DATA[moduleId];
  const retryQs = state.quizRetryQuestions;
  const answers = state.quizAnswers;
  let recovered = 0;
  retryQs.forEach((q, i) => {
    if (answers[i] === q.correctAnswer) recovered++;
  });

  const mod = state.progress.modules[moduleId];
  mod.retry_completed = true;
  mod.recovered_questions = retryQs.filter((q, i) => answers[i] === q.correctAnswer).map(q => q.questionId);
  mod.mastery_percentage = Math.round(((mod.first_attempt_score + recovered) / questions.length) * 100);
  updateOverallPercentage();
  saveProgress();
  checkAchievements();

  if (recovered > 0) unlockAchievement('comeback');

  return `
    <div class="quiz-result">
      <div class="quiz-result-score">Recovered ${recovered}/${retryQs.length}</div>
      <div class="quiz-result-message">🔄 Retry Complete!</div>
      <p>Your final mastery for this module: <strong>${mod.mastery_percentage}%</strong></p>
      <button class="nav-btn btn-next" onclick="goToDashboard()">🏠 Back to Dashboard</button>
    </div>
  `;
}

function renderFinalExamIntro() {
  return `
    <div class="slide-type-badge badge-quiz">Final Exam</div>
    <h2 class="slide-title">🏆 Final Exam</h2>
    <div class="slide-content">
      <p>You've reached the final exam! This covers all 10 modules.</p>
      <ul>
        <li>50 questions total</li>
        <li>Mix of easy, medium, and hard difficulty</li>
        <li>You need 80% (40/50) to pass</li>
        <li>You can retake as many times as needed</li>
      </ul>
      <div class="callout"><div class="callout-title">🎯 Ready?</div>Take your time and think through each question.</div>
      <button class="nav-btn btn-quiz" onclick="startFinalExamQuiz()" style="margin-top:20px;">Start Exam</button>
    </div>
  `;
}

function renderFinalExam() {
  const questions = FINAL_EXAM;
  if (state.finalExamCurrentQuestion >= questions.length) {
    return renderFinalExamResults();
  }

  const qIdx = state.finalExamCurrentQuestion;
  const q = questions[qIdx];
  const shuffled = shuffleArray(q.options.map((opt, i) => ({opt, idx: i})), q.questionId.split('').reduce((a,c)=>a+c.charCodeAt(0),0));

  let html = `
    <div class="slide-type-badge badge-quiz">Final Exam</div>
    <h2 class="slide-title">🏆 Final Exam</h2>
    <div class="quiz-container">
      <div style="margin-bottom:16px;font-size:0.9rem;color:#666;">Question ${qIdx + 1} of ${questions.length}</div>
      <div class="quiz-question">${q.question}</div>
  `;
  shuffled.forEach((item, i) => {
    html += `<button class="quiz-option" id="opt-${i}" onclick="answerFinalExam(${item.idx}, ${i})">${item.opt}</button>`;
  });
  html += `<div id="quiz-explanation" style="display:none;" class="quiz-explanation"></div>`;
  html += '</div>';
  return html;
}

function renderFinalExamResults() {
  const questions = FINAL_EXAM;
  const answers = state.finalExamAnswers;
  let correct = 0;
  answers.forEach((a, i) => {
    if (a === questions[i].correctAnswer) correct++;
  });
  const passed = correct >= 40;
  state.progress.final_exam_completed = true;
  state.progress.final_exam_score = correct;
  saveProgress();
  checkAchievements();

  let html = `
    <div class="quiz-result">
      <div class="quiz-result-score">${correct}/${questions.length}</div>
      <div class="quiz-result-message">${passed ? '🎉 Congratulations! You passed!' : '💪 Keep studying and try again!'}</div>
      <p>${passed ? 'You have demonstrated strong knowledge of AMPS 5.3.5.' : 'You need 40/50 to pass. Review weak modules and retake.'}</p>
      <button class="nav-btn btn-next" onclick="goToDashboard()">🏠 Back to Dashboard</button>
    </div>
  `;
  if (passed) showConfetti(80);
  return html;
}

function renderNavBar(slide) {
  const isQuiz = slide.type === 'quiz' || slide.type === 'final_exam_quiz';
  const isFirst = state.currentSlide === 0;
  const isLast = state.currentSlide === SLIDES.length - 1;

  let html = '<div class="nav-bar">';
  html += `<button class="nav-btn btn-prev" ${isFirst ? 'disabled' : ''} onclick="prev()">◀ Previous</button>`;
  html += `<button class="nav-btn btn-toc" onclick="toggleTOC()">☰ Contents</button>`;
  if (!isQuiz && slide.moduleId !== 'dashboard' && slide.moduleId !== 'final') {
    const quizIdx = getSlideIndexById(slide.moduleId, 'quiz');
    if (quizIdx >= 0) {
      html += `<button class="nav-btn btn-quiz" onclick="go(${quizIdx}); startQuiz('${slide.moduleId}')">📝 Quiz</button>`;
    }
  }
  html += `<button class="nav-btn btn-next" ${isLast ? 'disabled' : ''} onclick="next()">Next ▶</button>`;
  html += '</div>';
  return html;
}

function renderTOC() {
  let html = '<div class="toc-overlay" id="toc-overlay" onclick="if(event.target===this)toggleTOC()">';
  html += '<div class="toc-panel">';
  html += '<h2>📑 Table of Contents</h2>';

  // Dashboard link
  html += '<div class="toc-slide" onclick="go(0); toggleTOC()">🏠 Dashboard</div>';

  for (let i = 0; i < MODULE_NAMES.length; i++) {
    const modId = 'M' + i;
    const modSlides = SLIDES.filter(s => s.moduleId === modId);
    const mod = state.progress.modules[modId];
    html += `<div class="toc-module">`;
    html += `<div class="toc-module-header" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">`;
    html += `<span>${MODULE_NAMES[i]}</span>`;
    html += `<span>${mod.slides_completed >= mod.total_slides && mod.quiz_attempted ? '✅' : '▶️'}</span>`;
    html += `</div>`;
    html += `<div class="toc-module-slides">`;
    modSlides.forEach((s, idx) => {
      const globalIdx = SLIDES.indexOf(s);
      const isActive = globalIdx === state.currentSlide;
      const isCompleted = idx < mod.slides_completed;
      html += `<div class="toc-slide ${isActive ? 'active' : ''} ${isCompleted ? 'completed' : ''}" onclick="go(${globalIdx}); toggleTOC()">${s.title}</div>`;
    });
    html += `</div></div>`;
  }

  // Final exam
  const finalIntroIdx = SLIDES.findIndex(s => s.moduleId === 'final' && s.type === 'final_exam_intro');
  if (finalIntroIdx >= 0) {
    html += `<div class="toc-slide" onclick="go(${finalIntroIdx}); toggleTOC()">🏆 Final Exam</div>`;
  }

  html += '</div></div>';
  return html;
}

// ---------------------------------------------------------------------------
// Navigation
// ---------------------------------------------------------------------------
function go(idx) {
  if (idx < 0 || idx >= SLIDES.length) return;
  markSlideCompleted(state.currentSlide);
  state.currentSlide = idx;
  state.quizMode = false;
  state.quizRetryMode = false;
  state.finalExamMode = false;
  render();
}

function next() {
  if (state.currentSlide < SLIDES.length - 1) {
    markSlideCompleted(state.currentSlide);
    state.currentSlide++;
    render();
  }
}

function prev() {
  if (state.currentSlide > 0) {
    state.currentSlide--;
    render();
  }
}

function goToDashboard() {
  go(0);
}

function toggleTOC() {
  const overlay = document.getElementById('toc-overlay');
  if (overlay) {
    overlay.style.display = overlay.style.display === 'flex' ? 'none' : 'flex';
  }
}

// ---------------------------------------------------------------------------
// Quiz Engine
// ---------------------------------------------------------------------------
function startQuiz(moduleId) {
  state.quizMode = true;
  state.quizCurrentQuestion = 0;
  state.quizAnswers = [];
  state.quizRetryMode = false;
  state.quizRetryQuestions = [];
  render();
}

function startRetry(moduleId) {
  const mod = state.progress.modules[moduleId];
  const failedIds = mod.failed_questions;
  state.quizRetryMode = true;
  state.quizCurrentQuestion = 0;
  state.quizAnswers = [];
  state.quizRetryQuestions = QUIZ_DATA[moduleId].filter(q => failedIds.includes(q.questionId));
  render();
}

function answerQuiz(answerIdx, buttonIdx) {
  const moduleId = SLIDES[state.currentSlide].moduleId;
  const questions = state.quizRetryMode ? state.quizRetryQuestions : QUIZ_DATA[moduleId];
  const q = questions[state.quizCurrentQuestion];
  const isCorrect = answerIdx === q.correctAnswer;

  // Disable all buttons
  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === buttonIdx) {
      btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
    }
    // Highlight correct answer
    const shuffled = shuffleArray(q.options.map((opt, idx) => ({opt, idx})), q.questionId.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
    if (shuffled[i].idx === q.correctAnswer) {
      btn.classList.add('correct-answer');
    }
  });

  // Show explanation
  const expl = document.getElementById('quiz-explanation');
  const msg = isCorrect ? ENCOURAGEMENT_RIGHT[Math.floor(Math.random() * ENCOURAGEMENT_RIGHT.length)] : ENCOURAGEMENT_WRONG[Math.floor(Math.random() * ENCOURAGEMENT_WRONG.length)];
  expl.innerHTML = `<strong>${msg}</strong><br><br>${q.explanation}`;
  expl.style.display = 'block';

  state.quizAnswers.push(answerIdx);

  // Auto-advance after delay
  setTimeout(() => {
    state.quizCurrentQuestion++;
    render();
  }, 2500);
}

// ---------------------------------------------------------------------------
// Final Exam Engine
// ---------------------------------------------------------------------------
function startFinalExam() {
  const p = state.progress;
  const allDone = Object.values(p.modules).every(m => m.quiz_attempted && m.slides_completed >= m.total_slides);
  if (!allDone) return;
  go(SLIDES.findIndex(s => s.moduleId === 'final' && s.type === 'final_exam_intro'));
}

function startFinalExamQuiz() {
  state.finalExamMode = true;
  state.finalExamCurrentQuestion = 0;
  state.finalExamAnswers = [];
  go(SLIDES.findIndex(s => s.moduleId === 'final' && s.type === 'final_exam_quiz'));
}

function answerFinalExam(answerIdx, buttonIdx) {
  const q = FINAL_EXAM[state.finalExamCurrentQuestion];
  const isCorrect = answerIdx === q.correctAnswer;

  const buttons = document.querySelectorAll('.quiz-option');
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === buttonIdx) {
      btn.classList.add(isCorrect ? 'selected-correct' : 'selected-wrong');
    }
    const shuffled = shuffleArray(q.options.map((opt, idx) => ({opt, idx})), q.questionId.split('').reduce((a,c)=>a+c.charCodeAt(0),0));
    if (shuffled[i].idx === q.correctAnswer) {
      btn.classList.add('correct-answer');
    }
  });

  const expl = document.getElementById('quiz-explanation');
  const msg = isCorrect ? ENCOURAGEMENT_RIGHT[Math.floor(Math.random() * ENCOURAGEMENT_RIGHT.length)] : ENCOURAGEMENT_WRONG[Math.floor(Math.random() * ENCOURAGEMENT_WRONG.length)];
  expl.innerHTML = `<strong>${msg}</strong><br><br>${q.explanation}`;
  expl.style.display = 'block';

  state.finalExamAnswers.push(answerIdx);

  setTimeout(() => {
    state.finalExamCurrentQuestion++;
    render();
  }, 2500);
}

// ---------------------------------------------------------------------------
// Keyboard Navigation
// ---------------------------------------------------------------------------
document.addEventListener('keydown', (e) => {
  if (state.quizMode || state.finalExamMode) return; // Don't interfere with quiz
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    next();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prev();
  } else if (e.key === 'Home') {
    e.preventDefault();
    go(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    go(SLIDES.length - 1);
  } else if (e.key === 't' || e.key === 'T') {
    toggleTOC();
  }
});

// ---------------------------------------------------------------------------
// Initialize
// ---------------------------------------------------------------------------
render();
</script>
</body>
</html>
