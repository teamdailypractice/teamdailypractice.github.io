<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Grammar Premium Study App v2</title>
    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="./styles/study-tokens.css" />
    <link rel="stylesheet" href="./styles/animations.css" />
    <style>
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-item { padding: 0.5rem 0.75rem; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: 0.2s; font-size: 0.9rem; }
        .toc-item:hover { background: var(--color-violet-light); }
        .toc-item.active { background: var(--color-violet-light); color: var(--color-violet); font-weight: bold; }
        .progress-top { width: 140px; height: 10px; background: rgba(255,255,255,0.3); border-radius: 999px; overflow: hidden; }
        .progress-top > div { height: 100%; background: #fff; width: 0%; transition: width 0.4s; }
        footer { position: fixed; bottom: 0; left: 280px; right: 0; background: white; border-top: 1px solid var(--color-border); padding: 10px 2rem; display: flex; align-items: center; justify-content: space-between; z-index: 10; }
        @media (max-width: 720px) {
            .sidebar-toc { display: none; }
            footer { left: 0; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Shared Components ---

        const HintAccordion = ({ hints }) => {
            const [visibleHints, setVisibleHints] = useState(0);
            if (!hints || hints.length === 0) return null;
            return (
                <div style={{ marginTop: '15px', padding: '10px', backgroundColor: '#f0f9ff', borderRadius: '8px', border: '1px solid #bae6fd' }}>
                    {hints.slice(0, visibleHints).map((hint, index) => (
                        <p key={index} style={{ fontSize: '0.9rem', color: '#0369a1', marginBottom: '5px' }}>
                            <strong>💡 Hint {index + 1}:</strong> {hint}
                        </p>
                    ))}
                    {visibleHints < hints.length && (
                        <button 
                            className="btn-primary" 
                            style={{ padding: '4px 10px', fontSize: '0.8rem', backgroundColor: 'var(--color-violet)', border: 'none', color: 'white', borderRadius: '4px', cursor: 'pointer' }}
                            onClick={() => setVisibleHints(visibleHints + 1)}
                        >
                            {visibleHints === 0 ? 'Need a hint?' : 'Next hint'}
                        </button>
                    )}
                </div>
            );
        };

        const FlashcardView = ({ flashcard, onRating }) => {
            const [isFlipped, setIsFlipped] = useState(false);
            const [rated, setRated] = useState(null);
            
            const handleRating = (r) => {
                setRated(r);
                onRating(flashcard.id, r);
            };

            return (
                <div className="slide-premium animate-fade-in" style={{ cursor: 'pointer', textAlign: 'center', marginBottom: '20px', minHeight: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center' }} onClick={() => setIsFlipped(!isFlipped)}>
                    {!isFlipped ? (
                        <div>
                            <span className="badge" style={{ backgroundColor: 'var(--color-violet-light)', color: 'var(--color-violet)', padding: '4px 12px', borderRadius: '20px', fontSize: '0.7rem' }}>FLASHCARD</span>
                            <h3 style={{ marginTop: '20px' }}>{flashcard.front}</h3>
                            <p style={{ color: '#666', fontSize: '0.8rem' }}>Tap to reveal answer</p>
                        </div>
                    ) : (
                        <div>
                            {rated ? (
                                <div className="animate-bounce">
                                    <p style={{ fontSize: '1.5rem' }}>🚀</p>
                                    <p style={{ color: 'var(--color-emerald)', fontWeight: 'bold' }}>Scheduled for {rated} review!</p>
                                </div>
                            ) : (
                                <>
                                    <p style={{ fontSize: '1.2rem', marginBottom: '30px' }}>{flashcard.back}</p>
                                    <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }} onClick={e => e.stopPropagation()}>
                                        <button className="btn-primary" style={{ backgroundColor: 'var(--color-coral)', border: 'none', color: 'white', padding: '8px 16px', borderRadius: '8px' }} onClick={() => handleRating('hard')}>Hard</button>
                                        <button className="btn-primary" style={{ backgroundColor: 'var(--color-amber)', border: 'none', color: 'white', padding: '8px 16px', borderRadius: '8px' }} onClick={() => handleRating('good')}>Good</button>
                                        <button className="btn-primary" style={{ backgroundColor: 'var(--color-emerald)', border: 'none', color: 'white', padding: '8px 16px', borderRadius: '8px' }} onClick={() => handleRating('easy')}>Easy</button>
                                    </div>
                                </>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const MermaidDiagram = ({ definition }) => {
            const ref = useRef(null);
            const id = 'mermaid-' + Math.random().toString(36).substr(2, 9);

            useEffect(() => {
                if (ref.current && definition) {
                    try {
                        mermaid.render(id, definition).then(({ svg }) => {
                            if (ref.current) {
                                ref.current.innerHTML = svg;
                            }
                        });
                    } catch (e) {
                        console.error('Mermaid render failed:', e);
                        ref.current.innerHTML = '<p style="color:red">Diagram error: ' + e.message + '</p>';
                    }
                }
            }, [definition, id]);

            return (
                <div 
                    ref={ref} 
                    style={{ 
                        marginTop: '20px', 
                        textAlign: 'center', 
                        background: 'white', 
                        borderRadius: '12px', 
                        padding: '20px',
                        boxShadow: 'inset 0 0 10px rgba(0,0,0,0.05)',
                        overflowX: 'auto'
                    }}
                >
                    Loading diagram...
                </div>
            );
        };

        const SpeechTrigger = ({ text }) => {
            const speak = () => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ta-IN';
                window.speechSynthesis.speak(utterance);
            };
            return <button className="btn-primary" style={{ backgroundColor: 'white', color: 'var(--color-teal)', border: '1px solid var(--color-teal)', padding: '8px 16px', borderRadius: '8px', cursor: 'pointer' }} onClick={speak}>🔈 Read Aloud</button>;
        };

        const StudyTricksPortal = () => {
            const [isOpen, setIsOpen] = useState(false);
            const tricks = [
                { title: "1. Active Recall + Blind Writing", text: "Close the book and write what you remember without looking. Why: retrieval makes memory stronger than rereading.", color: "var(--color-coral)" },
                { title: "2. Spaced Repetition", text: "Revise after gaps: 10 mins, 1 day, 3 days, 1 week. Why: spacing fights forgetting.", color: "var(--color-teal)" },
                { title: "3. Blurting Method", text: "Blurt out everything you know on a blank page, then check what you missed. Why: shows your strengths and weaknesses.", color: "var(--color-amber)" },
                { title: "4. Teach-Back Method", text: "Explain the topic simply to a friend or even a toy! Why: teaching forces the brain to organize ideas.", color: "var(--color-emerald)" },
                { title: "5. Draw From Memory", text: "Look at a diagram, close it, and redraw it. Why: pictures + words = stronger recall paths.", color: "var(--color-violet)" },
                { title: "6. Memory Palace", text: "Place facts inside imaginary rooms in your house. Why: the brain is great at remembering locations.", color: "var(--color-coral)" },
                { title: "7. Chunking", text: "Break large info into small meaningful groups (like phone numbers). Why: easier for working memory to hold.", color: "var(--color-teal)" },
                { title: "8. Mixed Practice", text: "Mix different types of problems instead of doing one type. Why: trains the brain to choose the right method.", color: "var(--color-amber)" }
            ];

            return (
                <>
                    <button 
                        onClick={() => setIsOpen(true)}
                        style={{
                            position: 'fixed', bottom: '80px', right: '20px', width: '50px', height: '50px',
                            borderRadius: '50%', background: 'var(--gradient-header)', border: 'none',
                            color: 'white', fontSize: '24px', cursor: 'pointer', boxShadow: '0 4px 15px rgba(0,0,0,0.2)',
                            zIndex: 100, transition: '0.2s'
                        }}
                        title="Study Tricks"
                    >
                        💡
                    </button>
                    {isOpen && (
                        <div style={{
                            position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.8)',
                            display: 'flex', alignItems: 'center', justifyContent: 'center',
                            zIndex: 1000, padding: '20px', backdropFilter: 'blur(5px)'
                        }}>
                            <div className="slide-premium animate-fade-in" style={{ maxWidth: '600px', maxHeight: '90vh', overflowY: 'auto', background: 'var(--color-bg)' }}>
                                <button onClick={() => setIsOpen(false)} style={{ float: 'right', border: 'none', background: 'transparent', fontSize: '24px', cursor: 'pointer' }}>✕</button>
                                <h2 style={{ color: 'var(--color-violet)', textAlign: 'center' }}>🚀 8 Super Study Tricks</h2>
                                <div style={{ display: 'grid', gap: '15px', marginTop: '20px' }}>
                                    {tricks.map((trick, i) => (
                                        <div key={i} style={{ padding: '15px', borderRadius: '12px', background: 'white', borderLeft: `6px solid ${trick.color}`, boxShadow: '0 2px 8px rgba(0,0,0,0.05)' }}>
                                            <h4 style={{ margin: '0 0 5px 0', color: trick.color }}>{trick.title}</h4>
                                            <p style={{ margin: 0, fontSize: '0.9rem' }}>{trick.text}</p>
                                        </div>
                                    ))}
                                </div>
                                <button className="btn-primary" style={{ width: '100%', marginTop: '20px' }} onClick={() => setIsOpen(false)}>Got it, let's study!</button>
                            </div>
                        </div>
                    )}
                </>
            );
        };

        // --- Main App ---

        const QuizQuestion = ({ q, onAnswer }) => {
            const [selected, setSelected] = useState(null);
            return (
                <div className="slide-premium" style={{ marginBottom: '20px', minHeight: 'auto' }}>
                    <p style={{ fontWeight: 'bold' }}>{q.question}</p>
                    <div style={{ display: 'grid', gap: '10px', marginTop: '10px' }}>
                        {q.options.map((opt, oi) => {
                            let bgColor = 'white';
                            let textColor = '#333';
                            if (selected !== null) {
                                if (oi === q.answer) {
                                    bgColor = 'var(--color-emerald)';
                                    textColor = 'white';
                                } else if (oi === selected) {
                                    bgColor = 'var(--color-coral)';
                                    textColor = 'white';
                                }
                            }
                            return (
                                <button 
                                    key={oi} 
                                    className="btn-primary" 
                                    style={{ 
                                        textAlign: 'left', 
                                        backgroundColor: bgColor, 
                                        color: textColor, 
                                        border: '1px solid #ddd',
                                        transition: '0.3s',
                                        padding: '10px',
                                        borderRadius: '8px',
                                        cursor: 'pointer'
                                    }} 
                                    onClick={() => setSelected(oi)}
                                    disabled={selected !== null}
                                >
                                    {opt}
                                </button>
                            );
                        })}
                    </div>
                    {selected !== null && (
                        <p style={{ marginTop: '15px', color: selected === q.answer ? 'var(--color-emerald)' : 'var(--color-coral)', fontWeight: 'bold' }}>
                            {selected === q.answer ? '🌟 Correct! ' + q.explanation : '❌ Incorrect. ' + q.explanation}
                        </p>
                    )}
                    <HintAccordion hints={q.hints} />
                </div>
            );
        };

        const App = () => {
            const [data, setData] = useState(null);
            const [currentModuleIndex, setCurrentModuleIndex] = useState(0);
            const [currentSlideIndex, setCurrentSlideIndex] = useState(0);
            const [mode, setMode] = useState('study'); // study, quiz, flashcards

            useEffect(() => {
                fetch('./src/data/data.json')
                    .then(res => res.json())
                    .then(json => setData(json));
                mermaid.initialize({ startOnLoad: true });
            }, []);

            if (!data) return <div style={{ padding: '20px' }}>Loading Tamil Grammar Curriculum...</div>;

            const currentModule = data.modules[currentModuleIndex];
            const currentSlide = currentModule.slides[currentSlideIndex];

            const nextStep = () => {
                if (mode === 'study') {
                    if (currentSlideIndex < currentModule.slides.length - 1) {
                        setCurrentSlideIndex(currentSlideIndex + 1);
                    } else {
                        setMode('quiz');
                    }
                } else if (mode === 'quiz') {
                    setMode('flashcards');
                } else if (mode === 'flashcards') {
                    if (currentModuleIndex < data.modules.length - 1) {
                        setCurrentModuleIndex(currentModuleIndex + 1);
                        setCurrentSlideIndex(0);
                        setMode('study');
                    } else {
                        alert("Congratulations! You've completed the curriculum! 🏆");
                    }
                }
            };

            const prevStep = () => {
                if (mode === 'study') {
                    if (currentSlideIndex > 0) {
                        setCurrentSlideIndex(currentSlideIndex - 1);
                    } else if (currentModuleIndex > 0) {
                        // Go back to previous module's flashcards
                        setCurrentModuleIndex(currentModuleIndex - 1);
                        setMode('flashcards');
                    }
                } else if (mode === 'quiz') {
                    setMode('study');
                    setCurrentSlideIndex(currentModule.slides.length - 1);
                } else if (mode === 'flashcards') {
                    setMode('quiz');
                }
            };

            return (
                <div id="app">
                    <StudyTricksPortal />
                    <header className="header-premium">
                        <button className="btn-primary" style={{ background: 'transparent', border: '1px solid white', color: 'white', cursor: 'pointer' }}>☰</button>
                        <h1 style={{ margin: 0, fontSize: '1.2rem', flex: 1 }}>📚 Tamil Grammar v2</h1>
                        <div className="progress-top">
                            <div style={{ width: `${((currentSlideIndex + 1) / currentModule.slides.length) * 100}%` }}></div>
                        </div>
                        <button className="btn-primary" style={{ background: 'transparent', border: '1px solid white', color: 'white', cursor: 'pointer', marginLeft: '10px' }} onClick={() => { setCurrentModuleIndex(0); setCurrentSlideIndex(0); setMode('study'); }}>🏠</button>
                    </header>

                    <div className="app-layout">
                        <nav className="sidebar-toc">
                            <h3 style={{ fontSize: '0.9rem', color: 'var(--color-violet)', marginBottom: '1rem' }}>📖 Your Journey</h3>
                            <ul className="toc-list">
                                {data.modules.map((m, i) => (
                                    <li 
                                        key={i} 
                                        className={`toc-item ${i === currentModuleIndex ? 'active' : ''}`}
                                        onClick={() => { setCurrentModuleIndex(i); setCurrentSlideIndex(0); setMode('study'); }}
                                    >
                                        M{i+1}: {m.title}
                                    </li>
                                ))}
                            </ul>
                        </nav>

                        <main className="content-area">
                            {mode === 'study' && (
                                <div className="slide-premium">
                                    <h3 style={{ color: 'var(--color-violet)', marginBottom: '0.5rem' }}>{currentModule.title}</h3>
                                    <h2>{currentSlide.title}</h2>
                                    <ul style={{ paddingLeft: '1.5rem', marginTop: '1rem' }}>
                                        {currentSlide.content.map((c, i) => <li key={i} style={{ marginBottom: '10px' }}>{c}</li>)}
                                    </ul>
                                    {currentSlide.mermaid && <MermaidDiagram definition={currentSlide.mermaid} />}
                                    <div style={{ marginTop: '2rem' }}>
                                        <SpeechTrigger text={currentSlide.content.join('. ')} />
                                    </div>
                                </div>
                            )}

                            {mode === 'quiz' && (
                                <div style={{ width: '100%', maxWidth: '800px', paddingBottom: '100px' }}>
                                    <h2 style={{ textAlign: 'center', marginBottom: '2rem' }}>Module Quiz: {currentModule.title}</h2>
                                    {currentModule.quiz && currentModule.quiz.map((q, i) => (
                                        <QuizQuestion key={i} q={q} />
                                    ))}
                                    <button 
                                        className="btn-primary" 
                                        style={{ width: '100%', padding: '15px', borderRadius: '12px', border: 'none', backgroundColor: 'var(--color-teal)', color: 'white', fontWeight: 'bold', cursor: 'pointer' }} 
                                        onClick={nextStep}
                                    >
                                        Finish Quiz & Start SRS Review
                                    </button>
                                </div>
                            )}

                            {mode === 'flashcards' && (
                                <div style={{ width: '100%', maxWidth: '800px', paddingBottom: '100px' }}>
                                    <h2 style={{ textAlign: 'center', marginBottom: '2rem' }}>Daily Review (SRS)</h2>
                                    {currentModule.flashcards && currentModule.flashcards.length > 0 ? (
                                        currentModule.flashcards.map((fc, i) => (
                                            <FlashcardView key={i} flashcard={fc} onRating={(id, r) => alert(`Scheduled for ${r} review!`)} />
                                        ))
                                    ) : (
                                        <p style={{ textAlign: 'center' }}>No flashcards for this module.</p>
                                    )}
                                    <button 
                                        className="btn-primary" 
                                        style={{ width: '100%', padding: '15px', borderRadius: '12px', border: 'none', backgroundColor: 'var(--color-violet)', color: 'white', fontWeight: 'bold', cursor: 'pointer' }} 
                                        onClick={nextStep}
                                    >
                                        Continue to Next Module
                                    </button>
                                </div>
                            )}
                        </main>
                    </div>

                    <footer>
                        <button className="btn-primary" style={{ backgroundColor: '#f1f5f9', color: '#64748b', border: 'none', padding: '8px 16px', borderRadius: '8px', cursor: 'pointer' }} onClick={prevStep}>← Back</button>
                        <span style={{ fontWeight: '700', color: 'var(--color-violet)' }}>
                            {mode === 'study' ? `${currentSlideIndex + 1} / ${currentModule.slides.length}` : mode.toUpperCase()}
                        </span>
                        <button className="btn-primary" style={{ border: 'none', backgroundColor: 'var(--color-teal)', color: 'white', padding: '8px 16px', borderRadius: '8px', cursor: 'pointer' }} onClick={nextStep}>
                            {mode === 'study' && currentSlideIndex === currentModule.slides.length - 1 ? 'Start Quiz →' : 'Next →'}
                        </button>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
